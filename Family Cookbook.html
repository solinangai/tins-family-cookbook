<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Cookbook 家庭食譜</title>
<style>
  :root{
    --cream:#faf6ef; --ink:#2d2a26; --red:#b5432e; --gold:#c99b3f; --green:#5a7a52;
    --card:#ffffff; --line:#e8e0d2;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; background:var(--cream); color:var(--ink);}
  header{background:linear-gradient(135deg,#b5432e,#8f2f1e); color:#fff; padding:28px 20px 20px; text-align:center;}
  header h1{font-size:1.9rem; letter-spacing:1px;}
  header p{opacity:.9; margin-top:6px; font-size:.95rem;}
  nav{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; padding:14px; background:#fff; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:50;}
  nav button{border:1px solid var(--line); background:#fff; padding:8px 16px; border-radius:20px; font-size:.95rem; cursor:pointer; transition:.15s;}
  nav button.active{background:var(--red); color:#fff; border-color:var(--red);}
  .searchwrap{display:flex; justify-content:center; padding:14px;}
  .searchwrap input{width:min(480px,90%); padding:10px 16px; border:1px solid var(--line); border-radius:24px; font-size:1rem; background:#fff;}
  .subhead{max-width:1100px; margin:6px auto 0; padding:0 16px; font-size:1.15rem; color:var(--red); font-weight:700; display:flex; align-items:center; gap:8px;}
  .subhead::after{content:""; flex:1; height:1px; background:var(--line);}
  .grid{max-width:1100px; margin:10px auto 26px; padding:0 16px; display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer; transition:.15s; display:flex; flex-direction:column;}
  .card:hover{transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,.10);}
  .card img{width:100%; height:160px; object-fit:cover; background:#eee;}
  .card .body{padding:12px 14px 14px;}
  .card h3{font-size:1.02rem; line-height:1.3;}
  .card .cn{color:#8a7a5c; font-size:.95rem; margin-top:2px;}
  .card .meta{margin-top:8px; font-size:.8rem; color:#777; display:flex; gap:10px;}
  .tag{display:inline-block; font-size:.72rem; padding:2px 8px; border-radius:10px; background:#f3ecdd; color:#8a6d2f; margin-bottom:6px;}
  /* detail overlay */
  #overlay{position:fixed; inset:0; background:rgba(40,30,20,.55); display:none; z-index:100; overflow-y:auto; padding:24px 12px;}
  #overlay.show{display:block;}
  .sheet{max-width:760px; margin:0 auto; background:#fff; border-radius:16px; overflow:hidden; position:relative;}
  .sheet .hero{width:100%; max-height:340px; object-fit:cover; display:block;}
  .closebtn{position:absolute; top:12px; right:12px; background:rgba(0,0,0,.55); color:#fff; border:none; width:38px; height:38px; border-radius:50%; font-size:1.15rem; cursor:pointer;}
  .sheet .inner{padding:20px 24px 30px;}
  .sheet h2{font-size:1.5rem;}
  .sheet .cnname{color:#8a7a5c; font-size:1.15rem; margin-top:2px;}
  .infoline{display:flex; gap:16px; margin:10px 0 4px; font-size:.9rem; color:#666; flex-wrap:wrap;}
  .ytbtn{display:inline-flex; align-items:center; gap:8px; background:#c00; color:#fff; text-decoration:none; padding:9px 18px; border-radius:24px; font-weight:600; margin:12px 0 4px; font-size:.95rem;}
  .ytbtn:hover{background:#a00;}
  .linkbtn{display:inline-flex; align-items:center; gap:8px; background:var(--green); color:#fff; text-decoration:none; padding:9px 18px; border-radius:24px; font-weight:600; margin:12px 0 4px 8px; font-size:.95rem;}
  .sec{margin-top:18px;}
  .sec h4{color:var(--red); font-size:1.05rem; border-bottom:2px solid var(--gold); display:inline-block; padding-bottom:3px; margin-bottom:10px;}
  ul.ing{list-style:none;}
  ul.ing li{padding:7px 4px; border-bottom:1px dashed var(--line); display:flex; align-items:flex-start; gap:10px; font-size:.95rem;}
  ul.ing li .em{font-size:1.25rem; width:30px; text-align:center; flex-shrink:0;}
  ul.ing li .cnn{color:#8a7a5c; margin-left:6px;}
  ol.steps{padding-left:0; list-style:none; counter-reset:st;}
  ol.steps li{counter-increment:st; padding:10px 4px; border-bottom:1px dashed var(--line); font-size:.95rem; line-height:1.55; display:flex; gap:12px;}
  ol.steps li::before{content:counter(st); background:var(--gold); color:#fff; min-width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:.85rem; flex-shrink:0; margin-top:2px;}
  ol.steps li .cnstep{display:block; color:#8a7a5c; margin-top:3px;}
  .tip{margin-top:16px; background:#f6f0e2; border-left:4px solid var(--gold); padding:10px 14px; border-radius:6px; font-size:.9rem; line-height:1.5;}
  footer{text-align:center; padding:22px; color:#999; font-size:.85rem;}
  /* ===== cuisine filter row ===== */
  #cuisbar{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; padding:10px 14px 2px; background:#fff; border-bottom:1px solid var(--line);}
  #cuisbar button{border:1px solid var(--line); background:#fdfaf3; padding:5px 13px; border-radius:16px; font-size:.85rem; cursor:pointer; transition:.15s; color:#6b5d43;}
  #cuisbar button.active{background:var(--gold); color:#fff; border-color:var(--gold);}
  /* ===== clickable ingredients ===== */
  ul.ing li{cursor:pointer;}
  ul.ing li:hover{background:#faf4e8;}
  ul.ing li .cam{margin-left:auto; opacity:.4; flex-shrink:0; font-size:.85rem; align-self:center;}
  #ingpop{position:fixed; inset:0; background:rgba(40,30,20,.45); display:none; z-index:150; align-items:flex-end; justify-content:center;}
  #ingpop.show{display:flex;}
  .ingcard{background:#fff; width:100%; max-width:480px; border-radius:20px 20px 0 0; padding:26px 22px 34px; text-align:center; animation:up .18s ease;}
  @keyframes up{from{transform:translateY(40px); opacity:0;} to{transform:none; opacity:1;}}
  .ingcard .bigemo{font-size:3rem;}
  .ingcard .bigcn{font-size:2.1rem; font-weight:700; margin-top:6px;}
  .ingcard .bigen{font-size:1.05rem; color:#666; margin-top:4px;}
  .ingcard .hintt{font-size:.8rem; color:#999; margin-top:10px;}
  .ingcard .ibtns{display:flex; gap:10px; justify-content:center; margin-top:18px; flex-wrap:wrap;}
  .ingcard .ibtns a{background:var(--red); color:#fff; text-decoration:none; padding:11px 22px; border-radius:24px; font-weight:600; font-size:.95rem;}
  .ingcard .ibtns button{background:#eee; color:#444; border:none; padding:11px 22px; border-radius:24px; font-weight:600; font-size:.95rem; cursor:pointer;}
  /* ===== add / edit ===== */
  #fab{position:fixed; right:18px; bottom:18px; width:58px; height:58px; border-radius:50%; border:none; background:var(--red); color:#fff; font-size:2rem; line-height:1; cursor:pointer; box-shadow:0 6px 16px rgba(0,0,0,.28); z-index:90;}
  #fab:hover{background:#8f2f1e;}
  #editOverlay{position:fixed; inset:0; background:rgba(40,30,20,.55); display:none; z-index:120; overflow-y:auto; padding:24px 12px;}
  #editOverlay.show{display:block;}
  .esheet{max-width:640px; margin:0 auto; background:#fff; border-radius:16px; padding:20px 22px 28px;}
  .esheet h2{color:var(--red); font-size:1.3rem; margin-bottom:14px;}
  .efield{margin-bottom:12px;}
  .efield label{display:block; font-size:.85rem; font-weight:600; color:#6b5d43; margin-bottom:4px;}
  .efield input,.efield select,.efield textarea{width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:8px; font-size:16px; font-family:inherit; background:#fff;}
  .efield textarea{min-height:56px; resize:vertical;}
  .erow2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .ingrow,.steprow{display:flex; gap:6px; margin-bottom:6px; align-items:flex-start;}
  .ingrow input,.steprow textarea{padding:8px 10px; border:1px solid var(--line); border-radius:8px; font-size:16px; font-family:inherit;}
  .ingrow input.emj{width:52px; text-align:center; flex-shrink:0;}
  .ingrow input{flex:1; min-width:0;}
  .steprow textarea{flex:1; min-width:0; min-height:46px; resize:vertical;}
  .delrow{border:none; background:#f3e3df; color:var(--red); width:36px; height:36px; border-radius:8px; cursor:pointer; flex-shrink:0; font-size:1rem; margin-top:2px;}
  .addrow{border:1px dashed var(--gold); background:#fdf9ef; color:#8a6d2f; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:.9rem; margin-top:2px;}
  .ebtns{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap; align-items:center;}
  .ebtns button{padding:11px 22px; border-radius:24px; border:none; font-size:1rem; font-weight:600; cursor:pointer;}
  .savebtn{background:var(--green); color:#fff;}
  .cancelbtn{background:#eee; color:#444;}
  .delbtn{background:#f3e3df; color:var(--red); margin-left:auto;}
  .photoprev{width:120px; height:84px; object-fit:cover; border-radius:8px; border:1px solid var(--line); display:block; margin-top:6px; background:#eee;}
  .editbtn{display:inline-flex; align-items:center; gap:8px; background:#f3ecdd; color:#8a6d2f; border:none; padding:9px 18px; border-radius:24px; font-weight:600; margin:12px 0 4px 8px; font-size:.95rem; cursor:pointer; font-family:inherit;}
  .editbtn:hover{background:#eadfc5;}
  footer a{color:#999;}
  /* ===== mobile ===== */
  @media(max-width:700px){
    header{padding:20px 14px 14px;}
    header h1{font-size:1.35rem;}
    header p{font-size:.8rem;}
    nav{flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; padding:10px 12px; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
    nav::-webkit-scrollbar{display:none;}
    nav button{flex-shrink:0; padding:9px 15px;}
    #cuisbar{flex-wrap:nowrap; overflow-x:auto; justify-content:flex-start; padding:8px 12px 6px; scrollbar-width:none;}
    #cuisbar::-webkit-scrollbar{display:none;}
    #cuisbar button{flex-shrink:0;}
    .searchwrap{padding:10px 12px;}
    .grid{grid-template-columns:repeat(2,1fr); gap:10px; padding:0 10px;}
    .card img{height:110px;}
    .card .body{padding:9px 10px 11px;}
    .card h3{font-size:.9rem;}
    .card .cn{font-size:.82rem;}
    .card .meta{font-size:.72rem; gap:8px;}
    #overlay{padding:0;}
    .sheet{max-width:100%; min-height:100vh; border-radius:0;}
    .sheet .inner{padding:16px 16px 40px;}
    #editOverlay{padding:0;}
    .esheet{max-width:100%; min-height:100vh; border-radius:0; padding:18px 16px 40px;}
    .erow2{grid-template-columns:1fr;}
    #fab{right:14px; bottom:14px;}
  }
</style>
</head>
<body>
<header>
  <h1>🍳 Family Cookbook 家庭食譜 🥢</h1>
  <p>Made with love for our home kitchen · Tap any dish for the full recipe &amp; video 點選菜式看食譜和影片</p>
</header>

<nav id="tabs">
  <button data-cat="all" class="active">All 全部</button>
  <button data-cat="breakfast">🌅 Breakfast 早餐</button>
  <button data-cat="lunch">🍝 Lunch 午餐</button>
  <button data-cat="soup">🍲 Soup 湯</button>
  <button data-cat="appetizer">🥟 Appetizer 前菜</button>
  <button data-cat="main">🍗 Main 主菜</button>
  <button data-cat="dessert">🍮 Dessert 糖水</button>
</nav>

<div id="cuisbar"></div>

<div class="searchwrap"><input id="search" type="text" placeholder="🔍 Search a dish… 搜尋菜式…"></div>

<div id="content"></div>

<div id="overlay"><div class="sheet" id="sheet"></div></div>

<button id="fab" title="Add a new dish 新增菜式">＋</button>
<div id="editOverlay"><div class="esheet" id="esheet"></div></div>
<div id="ingpop"><div class="ingcard" id="ingcard"></div></div>

<footer>Family Cookbook · Breakfast, Lunch &amp; Dinner · 早午晚餐食譜 · 2026<br>

const R = [];
function yt(id){return "https://www.youtube.com/watch?v="+id;}

/* ================= BREAKFAST ================= */
R.push({cat:"main",en:"Shrimp & Scrambled Eggs",cn:"滑蛋蝦仁",img:th("EECaLvnu2g0"),ytid:"EECaLvnu2g0",time:"15 min",serves:"2-3",
ing:[["🦐","Shrimp, peeled & deveined 150g","蝦仁 150克"],["🥚","Eggs 4","雞蛋 4隻"],["🧂","Salt ½ tsp + white pepper","鹽半茶匙、白胡椒粉少許"],["🌽","Cornstarch 1 tsp (for shrimp)","粟粉 1茶匙（醃蝦用）"],["🧅","Spring onion, chopped 1","蔥花 1條"],["🥛","Milk 1 tbsp (optional)","牛奶 1湯匙（可省略）"],["🫒","Oil 2 tbsp","油 2湯匙"]],

R.push({cat:"breakfast",en:"High-Protein Greek Yogurt Bowl",cn:"高蛋白希臘乳酪碗",img:th("X1d70605sg4"),ytid:"X1d70605sg4",time:"5 min",serves:"1",

R.push({cat:"breakfast",en:"Vegetable & Cheese Omelette",cn:"蔬菜芝士奄列",img:th("0kFawY0FYcc"),ytid:"0kFawY0FYcc",time:"12 min",serves:"1-2",

/* ================= RENDER ================= */
const ORDER = ["breakfast","lunch","soup","appetizer","main","dessert"];
const content = document.getElementById("content");
let activeCat = "all", activeCuis = "all", query = "";

function fallbackImg(r){ return r.ytid ? th(r.ytid) : PH; }

function render(){
  const LIST = allRecipes();
  content.innerHTML = "";
  ORDER.forEach(cat=>{
    if(activeCat!=="all" && activeCat!==cat) return;
    const items = LIST.filter(r=>r.cat===cat
      && (activeCuis==="all" || r.cuisine===activeCuis)
      && (r.en.toLowerCase().includes(query)||r.cn.includes(query)));
    if(!items.length) return;
    const h = document.createElement("div");
    h.className="subhead";
    h.textContent = CATS[cat].icon+" "+CATS[cat].en+" "+CATS[cat].cn;
    content.appendChild(h);
    const g = document.createElement("div");
    g.className="grid";
    items.forEach(r=>{
      const c=document.createElement("div");
      c.className="card";
      const cu = CUIS[r.cuisine]||CUIS.chi;
      c.innerHTML = `<img loading="lazy" src="${encodeURI(r.img||fallbackImg(r))}" alt="${r.en}" onerror="this.onerror=null;this.src='${fallbackImg(r)}'">
        <div class="body"><span class="tag">${CATS[r.cat].icon} ${CATS[r.cat].cn}</span> <span class="tag">${cu.icon} ${cu.cn}</span>${r.custom?' <span class="tag" style="background:#e7efe4;color:#5a7a52">⭐ 自家菜</span>':(r.edited?' <span class="tag">✎ 已修改</span>':"")}
        <h3>${r.en}</h3><div class="cn">${r.cn}</div>
        <div class="meta"><span>⏱ ${r.time}</span><span>👥 ${r.serves}</span></div></div>`;
      c.onclick=()=>openDetail(r);
      g.appendChild(c);
    });
    content.appendChild(g);
  });
  if(!content.children.length){
    content.innerHTML = '<p style="text-align:center;color:#999;padding:40px">No dishes found 找不到菜式<br><br>Tap ＋ to add a dish 按＋新增菜式</p>';
  }
}

function openDetail(r){
  const s=document.getElementById("sheet");
  s.innerHTML = `
    <img class="hero" src="${encodeURI(r.img||fallbackImg(r))}" onerror="this.onerror=null;this.src='${fallbackImg(r)}'">
    <button class="closebtn" onclick="closeDetail()">✕</button>
    <div class="inner">
      <h2>${r.en}</h2><div class="cnname">${r.cn}</div>
      <div class="infoline"><span>⏱ ${r.time}</span><span>👥 Serves 供 ${r.serves}</span><span>${(CUIS[r.cuisine]||CUIS.chi).icon} ${(CUIS[r.cuisine]||CUIS.chi).en} ${(CUIS[r.cuisine]||CUIS.chi).cn}</span></div>
      ${r.ytid?`<a class="ytbtn" href="${yt(r.ytid)}" target="_blank">▶ Watch on YouTube 看影片</a>`:""}
      ${r.extra?`<a class="linkbtn" href="${r.extra.url}" target="_blank">📄 ${r.extra.label}</a>`:""}
      <button class="editbtn" onclick="openEditor('${r.id}')">✎ Edit 修改</button>
      <div class="sec"><h4>🧺 Ingredients 材料 <span style="font-size:.75rem;color:#999;font-weight:400">(tap to see photos 點材料睇相)</span></h4>
        <ul class="ing">${r.ing.map(i=>`<li><span class="em">${i[0]}</span><span>${i[1]}<span class="cnn">${i[2]}</span></span><span class="cam">📷</span></li>`).join("")}</ul>
      </div>
      <div class="sec"><h4>👩‍🍳 Method 做法</h4>
        <ol class="steps">${r.steps.map(st=>`<li><span>${st[0]}<span class="cnstep">${st[1]}</span></span></li>`).join("")}</ol>
      </div>
      ${r.tip?`<div class="tip">💡 <b>Tip 貼士:</b> ${r.tip}</div>`:""}
    </div>`;
  s.querySelectorAll("ul.ing li").forEach((li,i)=>{ li.onclick=()=>showIng(r.ing[i]); });
  document.getElementById("overlay").classList.add("show");
  document.body.style.overflow="hidden";
}
function closeDetail(){
  document.getElementById("overlay").classList.remove("show");
  document.body.style.overflow="";
}
document.getElementById("overlay").addEventListener("click",e=>{ if(e.target.id==="overlay") closeDetail(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeIng(); closeDetail(); closeEditor(); } });
document.getElementById("ingpop").addEventListener("click",e=>{ if(e.target.id==="ingpop") closeIng(); });

document.querySelectorAll("#tabs button").forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll("#tabs button").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    activeCat=b.dataset.cat;
    render();
    window.scrollTo({top:0,behavior:"smooth"});
  };
});
document.getElementById("search").addEventListener("input",e=>{
  query=e.target.value.trim().toLowerCase();
  render();
});

const PH="data:image/svg+xml,"+encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='400' height='300'><rect width='400' height='300' fill='#f3ecdd'/><text x='200' y='168' font-size='72' text-anchor='middle'>🍽️</text></svg>").replace(/'/g,"%27");
const LS_OV="cookbook_overrides_v1", LS_CU="cookbook_custom_v1";
function loadOv(){ try{ return JSON.parse(localStorage.getItem(LS_OV))||{}; }catch(e){ return {}; } }
function loadCu(){ try{ return JSON.parse(localStorage.getItem(LS_CU))||[]; }catch(e){ return []; } }
function saveOv(o){ localStorage.setItem(LS_OV, JSON.stringify(o)); }
function saveCu(a){ localStorage.setItem(LS_CU, JSON.stringify(a)); }
function allRecipes(){
  const ov=loadOv();
  return R.map(r=> ov[r.id] ? Object.assign({}, ov[r.id], {id:r.id, edited:true}) : r).concat(loadCu());
}

function cleanName(t){
  let s=(t||"").split(/[（(]/)[0];
  const m=s.search(/[0-9０-９½¼¾]/);
  if(m>0) s=s.slice(0,m);
  s=s.replace(/[,，、:：·\s]+$/,"").trim();
  return s||String(t||"").trim();
}
function showIng(ing){
  if(!ing) return;
  const cn=cleanName(ing[2]), en=cleanName(ing[1]);
  const q=encodeURIComponent(cn||en);
  document.getElementById("ingcard").innerHTML=`
    <div class="bigemo">${ing[0]||"🧺"}</div>
    <div class="bigcn">${cn||en}</div>
    <div class="bigen">${en}</div>
    <div class="hintt">買餸時可以畀檔主睇呢個名 · Show this name to the stall keeper</div>
    <div class="ibtns">
      <a href="https://www.google.com/search?tbm=isch&q=${q}" target="_blank">📷 See photos 睇相</a>
      <button onclick="closeIng()">Close 關閉</button>
    </div>`;
  document.getElementById("ingpop").classList.add("show");
}
function closeIng(){ document.getElementById("ingpop").classList.remove("show"); }

let editId=null;
function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }
function parseYT(t){
  t=(t||"").trim(); if(!t) return "";
  const m=t.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{6,})/);
  return m ? m[1] : (/^[\w-]{6,}$/.test(t) ? t : "");
}

      <button class="cancelbtn" onclick="closeEditor()">Cancel 取消</button>
      ${r&&r.custom?`<button class="delbtn" onclick="deleteDish()">🗑 Delete 刪除</button>`:""}
      ${r&&!r.custom&&loadOv()[r.id]?`<button class="delbtn" onclick="resetDish()">↺ Reset original 還原</button>`:""}
    </div>`;
  if(r&&r.img&&r.img.length>=500){ es.querySelector("#f_img").dataset.big=r.img; }
  (r&&r.ing.length?r.ing:[["🧺","",""]]).forEach(i=>addIngRow(i));
  (r&&r.steps.length?r.steps:[["",""]]).forEach(s2=>addStepRow(s2));
  const prev=document.getElementById("f_prev");
  const cur = r ? (r.img||fallbackImg(r)) : "";
  if(cur){ prev.src=cur; } else { prev.style.visibility="hidden"; }
  prev.onerror=()=>{ prev.style.visibility="hidden"; };
  document.getElementById("f_file").addEventListener("change", pickPhoto);
  document.getElementById("f_img").addEventListener("input", e=>{
    delete e.target.dataset.big;
    prev.style.visibility="visible"; prev.src=e.target.value;
  });
  const eo=document.getElementById("editOverlay");
  eo.classList.add("show"); eo.scrollTop=0;
  document.body.style.overflow="hidden";
}
function addIngRow(v){
  v=(v&&v.length)?v:["🧺","",""];
  const d=document.createElement("div"); d.className="ingrow";
  d.innerHTML=`<input class="emj" value="${esc(v[0])}"><input class="ien" placeholder="English" value="${esc(v[1])}"><input class="icn" placeholder="中文" value="${esc(v[2])}"><button type="button" class="delrow" onclick="this.parentNode.remove()">✕</button>`;
  document.getElementById("ingRows").appendChild(d);
}
function addStepRow(v){
  v=(v&&v.length)?v:["",""];
  const d=document.createElement("div"); d.className="steprow";
  d.innerHTML=`<textarea class="sen" placeholder="English"></textarea><textarea class="scn" placeholder="中文"></textarea><button type="button" class="delrow" onclick="this.parentNode.remove()">✕</button>`;
  d.querySelector(".sen").value=v[0]||"";
  d.querySelector(".scn").value=v[1]||"";
  document.getElementById("stepRows").appendChild(d);
}
function pickPhoto(e){
  const f=e.target.files[0]; if(!f) return;
  const img=new Image();
  img.onload=()=>{
    const max=800, sc=Math.min(1, max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");
    c.width=Math.round(img.width*sc); c.height=Math.round(img.height*sc);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    const url=c.toDataURL("image/jpeg",.75);
    const fi=document.getElementById("f_img");
    fi.value="📷 Photo attached 已選相片"; fi.dataset.big=url;
    const p=document.getElementById("f_prev"); p.style.visibility="visible"; p.src=url;
    URL.revokeObjectURL(img.src);
  };
  img.src=URL.createObjectURL(f);
}
function saveDish(){
  const en=document.getElementById("f_en").value.trim();
  const cn=document.getElementById("f_cn").value.trim();
  if(!en&&!cn){ alert("Please enter a dish name 請輸入菜名"); return; }
  const ytid=parseYT(document.getElementById("f_yt").value);
  const fi=document.getElementById("f_img");
  let img=fi.dataset.big || fi.value.trim();
  if(img.startsWith("📷")) img="";
  if(!img&&ytid) img=th(ytid);
  const ing=[...document.querySelectorAll("#ingRows .ingrow")].map(d=>[d.querySelector(".emj").value.trim()||"🧺", d.querySelector(".ien").value.trim(), d.querySelector(".icn").value.trim()]).filter(a=>a[1]||a[2]);
  const steps=[...document.querySelectorAll("#stepRows .steprow")].map(d=>[d.querySelector(".sen").value.trim(), d.querySelector(".scn").value.trim()]).filter(a=>a[0]||a[1]);
  const obj={cat:document.getElementById("f_cat").value, cuisine:document.getElementById("f_cuis").value,
    en:en||cn, cn, img, ytid,
    time:document.getElementById("f_time").value.trim()||"—",
    serves:document.getElementById("f_serves").value.trim()||"—",
    ing, steps, tip:document.getElementById("f_tip").value.trim()};
  try{
    if(editId && editId.charAt(0)==="u"){
      const cu=loadCu(); const i=cu.findIndex(x=>x.id===editId);
      obj.id=editId; obj.custom=true;
      if(i>=0) cu[i]=obj; else cu.push(obj);
      saveCu(cu);
    }else if(editId){
      const ov=loadOv(); obj.id=editId; ov[editId]=obj; saveOv(ov);
    }else{
      obj.id="u"+Date.now(); obj.custom=true;
      const cu=loadCu(); cu.push(obj); saveCu(cu);
    }
  }catch(err){ alert("Could not save — storage may be full. Try a smaller photo.\n儲存失敗，空間可能已滿，試下細啲嘅相。"); return; }
  closeEditor(); render();
}
function deleteDish(){
  if(!confirm("Delete this dish? 確定刪除呢道菜？")) return;
  saveCu(loadCu().filter(x=>x.id!==editId));
  closeEditor(); render();
}
function resetDish(){
  if(!confirm("Restore the original recipe? 還原為原本食譜？")) return;
  const ov=loadOv(); delete ov[editId]; saveOv(ov);
  closeEditor(); render();
}
function closeEditor(){
  document.getElementById("editOverlay").classList.remove("show");
  if(!document.getElementById("overlay").classList.contains("show")) document.body.style.overflow="";
}
document.getElementById("fab").onclick=()=>openEditor(null);

/* ================= BACKUP / RESTORE ================= */
document.getElementById("bkup").onclick=e=>{
  e.preventDefault();
  const data=JSON.stringify({overrides:loadOv(), custom:loadCu()}, null, 1);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([data],{type:"application/json"}));
  a.download="cookbook-backup.json"; a.click();
};
document.getElementById("rstrlink").onclick=e=>{ e.preventDefault(); document.getElementById("rstr").click(); };
document.getElementById("rstr").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      saveOv(d.overrides||{}); saveCu(d.custom||[]);
      render(); alert("Backup restored 已還原備份");
    }catch(err){ alert("Invalid backup file 備份檔無效"); }
    e.target.value="";
  };
  rd.readAsText(f);
});

render();
</script>
</body>
</html>
