<style>
html,body{margin:0;padding:0;height:100%;background:#EFE6CF;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
a{color:#8A5A33;text-decoration:none}a:hover{opacity:.75}
input,button,textarea{font:inherit;color:inherit}
::-webkit-scrollbar{width:0;height:0}
@keyframes rise{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#frame{height:100dvh;display:flex;justify-content:center;background:#EFE6CF}
#app{width:100%;max-width:440px;height:100%;position:relative;overflow:hidden;background:#FAF2DD;font-family:'Newsreader','Noto Serif TC',serif;color:#4A4A46;display:flex;flex-direction:column;overscroll-behavior:contain}
#app *{overscroll-behavior-y:contain}
  #ptrbox{position:absolute;top:0;left:0;right:0;height:0;z-index:90;pointer-events:none}
  .ptrpill{position:absolute;top:0;left:50%;background:#4A4A46;color:#FAF2DD;padding:.45em 1em;border-radius:1.4em;
           font-size:12px;white-space:nowrap;font-family:'Instrument Sans',sans-serif;font-weight:600}
.ins{font-family:'Instrument Sans',sans-serif}
.tc{font-family:'Noto Serif TC',serif}
.eyebrow{font-size:.72em;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#8A5A33;font-family:'Instrument Sans',sans-serif}
.rule{display:flex;align-items:baseline;gap:.5em;font-family:'Instrument Sans',sans-serif}
.rule .line{flex:1;height:1px;background:#EADFC2}
.ybtn{background:#F7C948;color:#4A4A46;cursor:pointer}
.ybtn:hover{background:#EFBB2C}
.card{background:#FFFBEE;border:1px solid #EADFC2;border-radius:1em;overflow:hidden;cursor:pointer}
.card:hover{border-color:#F7C948}
/* The bottom bar is chrome, not reading matter: it keeps its own fixed sizes so
   that turning the text up for tired eyes cannot squash it or bend the + into
   an oval. Everything here is in px on purpose. */
/* The space below the labels is the phone's own — the home-indicator strip on
   an iPhone, nothing on a laptop. Adding a fixed 20px on top of it left a band
   of empty cream on newer phones, so the bar now takes whichever is larger and
   no more. */
  #tabbar{position:relative;z-index:60;font-size:15px;display:flex;align-items:center;justify-content:space-around;
          padding:8px 8px max(8px, env(safe-area-inset-bottom, 0px));
          background:#FFFBEE;border-top:1px solid #EADFC2;flex:none}
  .tabbtn{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;width:60px;flex:none}
  .tabbtn svg{width:23px;height:23px;display:block;flex:none}
  .tabbtn b{font-size:10.5px;font-weight:600;letter-spacing:.01em;line-height:1;white-space:nowrap}
  #fabwrap{position:relative;z-index:80;width:50px;height:50px;min-width:50px;min-height:50px;flex:none;
           border-radius:50%;display:flex;align-items:center;justify-content:center;
           font-size:27px;line-height:0;font-weight:300;margin-top:-21px;box-shadow:0 6px 16px rgba(247,201,72,.55)}
  .tabbadge{position:absolute;top:-4px;right:8px;background:#F7C948;color:#4A4A46;font-size:9.5px;font-weight:700;
            border-radius:10px;padding:1px 5px;line-height:1.5}
  .booktab{flex:1;text-align:center;padding:.55em 0;border:1px solid;border-radius:.7em;font-size:.86em;cursor:pointer}
  .daychip{flex:none;white-space:nowrap;padding:.5em .8em;border:1px solid;border-radius:1.3em;font-size:.82em;cursor:pointer}
  .stepimg{width:100%;max-width:100%;border-radius:.7em;margin-top:.5em;display:block;background:#F0E6CF}
  .cookimg{width:100%;max-height:38vh;object-fit:cover;border-radius:.9em;margin-top:.9em;background:#2b2b26}
  .stepthumb{width:4.2em;height:4.2em;object-fit:cover;border-radius:.5em;flex:none;background:#F0E6CF}
/* ============ one cookbook, three shapes ============

   The cookbook is designed for a phone held in one hand over a hot pan, and
   that stays the reference. A tablet simply gets a wider page and more dishes
   in view. A laptop gets the same page with the five buttons stood up along
   the left, where a pointer expects them, instead of a thumb-bar at the foot of
   a very tall window. Nothing is hidden or added at any size — it is the same
   cookbook, sitting differently. */
  #mainpane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
  .dishgrid{display:grid;gap:.85em;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .dishgrid.wide{grid-template-columns:1fr}
  .dishgrid.even{grid-auto-rows:1fr}

  /* --- tablet: a wider page, and the cards fill it --- */
  @media (min-width:640px){
    #app{max-width:720px}
    .dishgrid.wide{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
    #tabbar{justify-content:center;gap:clamp(18px,6vw,64px)}
  }

  /* --- laptop and desktop: two panes, and the nav stands up on the left ---
     Each of the three columns scrolls on its own. That is the thing a phone
     cannot do, and the reason this layout exists: the list of dishes stays put
     while a recipe is read, and inside the recipe the ingredients stay put
     while the method is read. */
  @media (min-width:1024px){
    #app{max-width:1440px;flex-direction:row;box-shadow:0 0 0 1px #EADFC2}
    #tabbar{display:none}

    #rail{width:236px;flex:none;background:#FFFBEE;border-right:1px solid #EADFC2;
          display:flex;flex-direction:column;padding:1.5em 1em 1.25em;min-height:0}
    .navitem{display:flex;align-items:center;gap:.7em;padding:.62em .7em;border-radius:10px;
             font-size:.85em;font-weight:600;cursor:pointer;line-height:1}
    .navitem:hover{background:#FAF2DD}
    .navico{width:1.25em;height:1.25em;flex:none;display:block}
    .navico svg{width:100%;height:100%;display:block}

    #browsecol{width:404px;flex:none;background:#FAF2DD;border-right:1px solid #EADFC2;
               display:flex;flex-direction:column;min-height:0}
    #recipecol{flex:1;min-width:0;background:#FFFBEE;display:flex;flex-direction:column;min-height:0}
    #recipecols{display:grid;grid-template-columns:1fr 1.15fr;gap:1.9em;margin-top:1.5em}
    .chipcat{border:1px solid;border-radius:18px;padding:.4em .8em;font-size:.78em;cursor:pointer;white-space:nowrap}
    .card.chosen{border-color:#F7C948;box-shadow:0 0 0 1px #F7C948}
    /* 404px of browse column lands on two cards without a special rule */
    #mainpane{flex:1;min-width:0;max-width:720px;margin:0 auto}

    /* cook mode: the step on the left, what you need on the right */
    #cookwide{position:absolute;inset:0;background:#35352F;color:#FFFBEE;z-index:25;
              display:flex;flex-direction:column;padding:1.8em 2.6em 2em;
              font-family:'Newsreader','Noto Serif TC',serif}
    #cookcols{flex:1;display:grid;grid-template-columns:1.55fr .9fr;gap:3em;min-height:0;padding-top:1.6em}
  }

  /* --- a short window (a laptop in landscape, a phone on its side) --- */
  @media (max-height:520px) and (max-width:1023px){
    #tabbar{padding:5px 8px max(5px, env(safe-area-inset-bottom, 0px))}
    .tabbtn svg{width:19px;height:19px}
    .tabbtn b{font-size:9.5px}
    #fabwrap{width:42px;height:42px;min-width:42px;min-height:42px;font-size:23px;margin-top:-16px}
  }

    #who{position:fixed;inset:0;background:rgba(45,42,38,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:1.2em}
  .whocard{background:#FAF2DD;border-radius:1.2em;padding:1.4em 1.3em;max-width:22em;width:100%;text-align:center}
  .whobtns{display:flex;flex-wrap:wrap;gap:.5em;justify-content:center;margin-top:1em}
  .whobtns span{padding:.6em 1.1em;border-radius:1.4em;background:#FFFBEE;border:1px solid #EADFC2;cursor:pointer;font-size:1.02em}
  .whobtns span:hover{border-color:#F7C948}
  .byline{font-size:.78em;color:#87806F;margin-top:.6em;font-family:'Instrument Sans',sans-serif}
.tabbtn:hover{color:#8A5A33 !important}
.chip{padding:.42em .8em;background:#F5E9CC;border-radius:.5em;font-size:.78em;font-weight:600;color:#6E6357;font-family:'Instrument Sans',sans-serif}
.finput{width:100%;background:#FFFBEE;border:1px solid #EADFC2;border-radius:.7em;padding:.8em .9em;font-size:1em;outline:none;font-family:'Newsreader',serif}
.crow{display:flex;justify-content:space-between;align-items:center;padding:.85em 0;border-bottom:1px solid #EADFC2;cursor:pointer}
.tgl{width:3em;height:1.75em;border-radius:1em;position:relative;flex:none;transition:background .2s}
.tgl span{position:absolute;top:.18em;width:1.4em;height:1.4em;border-radius:50%;background:#FFFBEE;transition:left .2s}
.setrow{display:flex;justify-content:space-between;align-items:center;background:#FFFBEE;border:1px solid #EADFC2;border-radius:.75em;padding:.85em 1em;cursor:pointer;gap:1em}
.addrow{margin-top:.6em;text-align:center;border:1px dashed #DCCFAF;border-radius:.7em;padding:.7em;font-size:.9em;font-family:'Instrument Sans',sans-serif;font-weight:600;color:#8A5A33;cursor:pointer}
textarea.f2{width:100%;background:#FFFBEE;border:1px solid #EADFC2;border-radius:.7em;padding:.7em .85em;font-size:1em;outline:none;resize:none;font-family:'Newsreader',serif;line-height:1.4}
</style>

/* ============ built-in recipes (43) ============ */
const RECIPES = ([{"id": "r0", "cat": "main", "en": "Shrimp & Scrambled Eggs", "cn": "滑蛋蝦仁", "img": "https://i.ytimg.com/vi/EECaLvnu2g0/hqdefault.jpg", "ytid": "EECaLvnu2g0", "time": "15 min", "serves": "2-3", "ing": [["🦐", "Shrimp, peeled & deveined 150g", "蝦仁 150克"], ["🥚", "Eggs 4", "雞蛋 4隻"], ["🧂", "Salt ½ tsp + white pepper", "鹽半茶匙、白胡椒粉少許"], ["🌽", "Cornstarch 1 tsp (for shrimp)", "粟粉 1茶匙（醃蝦用）"], ["🧅", "Spring onion, chopped 1", "蔥花 1條"], ["🥛", "Milk 1 tbsp (optional)", "牛奶 1湯匙（可省略）"], ["🫒", "Oil 2 tbsp", "油 2湯匙"]], "steps": [["Pat shrimp dry, marinate with salt, pepper and cornstarch for 10 minutes.", "蝦仁抹乾，用鹽、胡椒粉、粟粉醃10分鐘。"], ["Beat eggs with salt, milk and half the spring onion.", "雞蛋加鹽、牛奶和一半蔥花打勻。"], ["Stir-fry shrimp over medium heat until just pink (about 1 minute), remove.", "中火炒蝦仁至剛轉粉紅色（約1分鐘），盛起。"], ["Add shrimp into the egg mixture. Heat oil in the wok until warm, pour in eggs.", "蝦仁加入蛋液。鑊中燒油至微熱，倒入蛋液。"], ["Push eggs gently from the edge to the centre over LOW heat. Remove while still slightly runny — they finish cooking on the plate. Top with spring onion.", "細火用鑊鏟由邊向中心輕推，蛋未全熟帶少許流動狀便上碟（餘溫會繼續煮熟），撒上蔥花。"]], "tip": "Low heat and stopping early = silky eggs. 全程細火、早少少熄火，蛋才嫩滑。"}, {"id": "r1", "cat": "main", "en": "Steamed Egg with Minced Pork", "cn": "肉碎蒸水蛋", "img": "https://i.ytimg.com/vi/lHNK_wRVioI/hqdefault.jpg", "ytid": "lHNK_wRVioI", "time": "20 min", "serves": "2-3", "ing": [["🥚", "Eggs 3", "雞蛋 3隻"], ["🐖", "Minced pork 80g", "免治豬肉 80克"], ["💧", "Warm water 1.5× volume of eggs", "溫水（蛋液1.5倍）"], ["🧂", "Salt ½ tsp", "鹽半茶匙"], ["🍶", "Light soy sauce 2 tsp", "生抽 2茶匙"], ["🧅", "Spring onion, chopped", "蔥花少許"], ["🫒", "Sesame oil few drops", "麻油數滴"]], "steps": [["Season minced pork with 1 tsp soy sauce; stir-fry until cooked and set aside.", "免治豬肉用1茶匙生抽略醃，炒熟備用。"], ["Beat eggs with salt, add warm water (1.5× egg volume), mix and strain through a sieve.", "雞蛋加鹽打勻，加入1.5倍溫水，拌勻後過篩。"], ["Pour into a shallow dish, cover with cling film or a plate.", "倒入淺碟，蓋上保鮮紙或碟。"], ["Steam over medium-low heat 10–12 minutes until just set.", "中細火蒸10至12分鐘至剛凝固。"], ["Top with pork, spring onion, soy sauce and sesame oil.", "放上肉碎、蔥花，淋生抽和麻油。"]], "tip": "Strain the egg and keep the steam gentle for a mirror-smooth surface. 蛋液過篩、細火蒸，表面才平滑如鏡。"}, {"id": "r2", "cat": "breakfast", "en": "High-Protein Greek Yogurt Bowl", "cn": "高蛋白希臘乳酪碗", "img": "https://i.ytimg.com/vi/X1d70605sg4/hqdefault.jpg", "ytid": "X1d70605sg4", "time": "5 min", "serves": "1", "ing": [["🥛", "Plain Greek yogurt (unsweetened) 200g", "無糖希臘乳酪 200克"], ["🫐", "Blueberries / strawberries ½ cup", "藍莓或士多啤梨 半杯"], ["🥜", "Mixed nuts & seeds 2 tbsp", "雜果仁及籽 2湯匙"], ["🥣", "Chia seeds 1 tsp", "奇亞籽 1茶匙"], ["🍯", "Honey 1 tsp (optional, small amount)", "蜜糖 1茶匙（可省略，少量）"], ["🥥", "Unsweetened coconut flakes / cinnamon", "無糖椰絲或肉桂粉少許"]], "steps": [["Spoon yogurt into a bowl.", "乳酪放入碗中。"], ["Top with berries, nuts, seeds and coconut flakes.", "加上莓果、果仁、籽和椰絲。"], ["Drizzle a little honey only if needed; serve immediately.", "如需要才淋少量蜜糖，即食。"]], "tip": "Unsweetened yogurt + nuts keeps blood sugar steady — avoid flavoured yogurt. 選無糖乳酪，避免調味乳酪，血糖更穩定。"}, {"id": "r3", "cat": "breakfast", "en": "Vegetable & Cheese Omelette", "cn": "蔬菜芝士奄列", "img": "https://i.ytimg.com/vi/0kFawY0FYcc/hqdefault.jpg", "ytid": "0kFawY0FYcc", "time": "12 min", "serves": "1-2", "ing": [["🥚", "Eggs 3", "雞蛋 3隻"], ["🫑", "Bell pepper, diced ¼", "甜椒粒 ¼個"], ["🧅", "Onion, diced ¼", "洋蔥粒 ¼個"], ["🍄", "Mushrooms, sliced 3", "蘑菇片 3隻"], ["🧀", "Cheese, shredded 30g", "芝士碎 30克"], ["🧂", "Salt & black pepper", "鹽、黑胡椒少許"], ["🧈", "Butter or oil 1 tbsp", "牛油或油 1湯匙"]], "steps": [["Sauté onion, pepper and mushrooms with a pinch of salt until soft; set aside.", "洋蔥、甜椒、蘑菇加少許鹽炒軟，盛起。"], ["Beat eggs with salt and pepper.", "雞蛋加鹽和胡椒打勻。"], ["Melt butter over medium-low heat, pour in eggs and stir gently until half set.", "中細火下牛油，倒入蛋液輕拌至半熟。"], ["Spread vegetables and cheese over one half.", "蔬菜和芝士鋪在一邊。"], ["Fold over, cook 30 more seconds and slide onto a plate.", "對摺，再煎30秒即上碟。"]], "tip": "Take it off the heat while the centre is still soft. 中心仍軟身時離火最嫩滑。"}, {"id": "r4", "cat": "breakfast", "en": "Salmon, Avocado & Poached Egg", "cn": "三文魚牛油果水波蛋", "img": "https://i.ytimg.com/vi/j9tAAOpLwzo/hqdefault.jpg", "ytid": "j9tAAOpLwzo", "time": "15 min", "serves": "1", "ing": [["🐟", "Salmon fillet 120g (or smoked salmon 60g)", "三文魚柳 120克（或煙三文魚 60克）"], ["🥑", "Avocado ½, sliced", "牛油果 半個切片"], ["🥚", "Eggs 2", "雞蛋 2隻"], ["🍞", "Wholegrain bread 1 slice (optional)", "全麥麵包 1片（可省略）"], ["🍋", "Lemon juice, salt, black pepper", "檸檬汁、鹽、黑胡椒"], ["🫒", "Olive oil 1 tsp", "橄欖油 1茶匙"]], "steps": [["Season salmon; pan-fry 3 minutes each side until just cooked.", "三文魚調味，每面煎約3分鐘至剛熟。"], ["Poach eggs: simmering water + splash of vinegar, swirl, drop egg in, 3 minutes.", "煮水波蛋：水微滾加少許醋，攪出漩渦下蛋，煮3分鐘。"], ["Slice avocado, season with lemon juice and salt.", "牛油果切片，加檸檬汁和鹽。"], ["Plate salmon, avocado and eggs (on toast if using); finish with pepper and olive oil.", "三文魚、牛油果、水波蛋上碟（可配多士），灑黑胡椒、橄欖油。"]], "tip": "Protein + good fat, very little starch — ideal for steady morning energy. 高蛋白高好脂肪、低澱粉，早上血糖不會飆升。"}, {"id": "r5", "cat": "breakfast", "en": "Cottage Cheese & Tomato Toast", "cn": "茅屋芝士番茄多士", "img": "https://i.ytimg.com/vi/-EiOAHbtFlg/hqdefault.jpg", "ytid": "-EiOAHbtFlg", "time": "8 min", "serves": "1", "ing": [["🧀", "Cottage cheese 150g", "茅屋芝士 150克"], ["🍞", "Wholegrain bread 1-2 slices, toasted", "全麥麵包 1至2片（烘香）"], ["🍅", "Cherry tomatoes 8, halved", "車厘茄 8粒（開半）"], ["🫒", "Olive oil 1 tsp", "橄欖油 1茶匙"], ["🌿", "Basil or spring onion + black pepper, salt", "羅勒或蔥花、黑胡椒、鹽"]], "steps": [["Toast the bread until golden.", "麵包烘至金黃。"], ["Spread cottage cheese thickly on top.", "厚厚塗上茅屋芝士。"], ["Top with tomatoes (fresh, or pan-blistered 2 minutes for extra sweetness).", "放上車厘茄（生食或煎2分鐘更甜）。"], ["Season with salt, pepper, olive oil and herbs.", "加鹽、黑胡椒、橄欖油、香草。"]], "tip": "Cottage cheese has ~12g protein per 100g with little sugar. 茅屋芝士每100克約12克蛋白質，低糖。"}, {"id": "r6", "cat": "breakfast", "en": "Egg White Veggie Scramble", "cn": "蛋白炒蔬菜", "img": "https://i.ytimg.com/vi/nqaVK50PCgA/hqdefault.jpg", "ytid": "nqaVK50PCgA", "time": "10 min", "serves": "1", "ing": [["🥚", "Egg whites 5 (or 1 cup liquid egg white)", "蛋白 5隻份"], ["🥬", "Spinach 1 handful", "菠菜 一把"], ["🍅", "Cherry tomatoes 6, halved", "車厘茄 6粒（開半）"], ["🧄", "Garlic 1 clove, minced", "蒜蓉 1瓣"], ["🫒", "Olive oil 1 tsp + salt + black pepper", "橄欖油1茶匙、鹽、黑胡椒"]], "steps": [["Sauté garlic and tomatoes 1 minute; add spinach until wilted.", "炒香蒜蓉和番茄1分鐘，下菠菜炒至軟。"], ["Pour in egg whites with a pinch of salt.", "倒入加了少許鹽的蛋白。"], ["Stir gently over low heat until just set and fluffy.", "細火輕炒至剛凝固鬆軟。"], ["Season with black pepper and serve.", "加黑胡椒即成。"]], "tip": "Low heat keeps egg whites tender, never rubbery. 細火炒蛋白先唔會韌。"}, {"id": "r7", "cat": "breakfast", "en": "Soy Milk, Jammy Eggs & Edamame Plate", "cn": "無糖豆漿溏心蛋枝豆早餐", "img": "https://i.ytimg.com/vi/mcXzPF4-LFw/hqdefault.jpg", "ytid": "mcXzPF4-LFw", "time": "10 min", "serves": "1", "ing": [["🥚", "Eggs 2", "雞蛋 2隻"], ["🥛", "Unsweetened soy milk 1 glass", "無糖豆漿 1杯"], ["🫛", "Frozen edamame ½ cup", "急凍枝豆 半杯"], ["🧂", "Salt / soy sauce few drops", "鹽或豉油少許"]], "steps": [["Boil eggs 7 minutes for jammy yolks; cool in iced water and peel.", "雞蛋滾水煮7分鐘（溏心），冰水浸凍去殼。"], ["Boil edamame 3 minutes in salted water.", "枝豆鹽水灼3分鐘。"], ["Warm the soy milk (no sugar).", "豆漿加熱（不加糖）。"], ["Serve together — about 20g protein, almost no sugar.", "一齊上碟——約20克蛋白質，幾乎無糖。"]], "tip": "7 minutes exactly = jammy; 9 minutes = fully set. 足7分鐘係溏心，9分鐘全熟。"}, {"id": "r8", "cat": "lunch", "en": "Garlic Prawn Spaghetti (Aglio e Olio)", "cn": "蒜香蝦仁意粉", "img": "https://i.ytimg.com/vi/SpkBLuHmGos/hqdefault.jpg", "ytid": "SpkBLuHmGos", "time": "25 min", "serves": "2", "ing": [["🍝", "Spaghetti 200g", "意粉 200克"], ["🦐", "Prawns, peeled 15", "蝦仁 15隻"], ["🧄", "Garlic, sliced 6 cloves", "蒜片 6瓣"], ["🌶️", "Dried chilli flakes ½ tsp", "乾辣椒碎 半茶匙"], ["🫒", "Olive oil 4 tbsp", "橄欖油 4湯匙"], ["🌿", "Parsley, chopped", "番茜碎少許"], ["🍋", "Lemon ½", "檸檬 半個"], ["🧂", "Salt & black pepper", "鹽、黑胡椒"]], "steps": [["Cook spaghetti in well-salted water 1 minute less than the packet says; keep 1 cup pasta water.", "意粉用加鹽滾水煮（比包裝時間少1分鐘），留1杯煮麵水。"], ["Sauté prawns in 1 tbsp oil until pink; remove.", "1湯匙油炒蝦至轉色，盛起。"], ["Gently cook garlic and chilli in remaining oil over low heat until golden — do not burn.", "餘下油細火炒香蒜片和辣椒碎至金黃（切勿炒燶）。"], ["Add spaghetti, prawns and a splash of pasta water; toss until glossy.", "加入意粉、蝦和少許煮麵水，兜勻至有光澤。"], ["Finish with parsley, lemon juice, salt and pepper.", "最後加番茜、檸檬汁、鹽和黑胡椒。"]], "tip": "The starchy pasta water makes the sauce cling. 煮麵水的澱粉令醬汁掛在麵上。"}, {"id": "r9", "cat": "lunch", "en": "Teriyaki Chicken Rice Bowl", "cn": "照燒雞肉飯", "img": "https://i.ytimg.com/vi/lNTUc_V_6Gs/hqdefault.jpg", "ytid": "lNTUc_V_6Gs", "time": "25 min", "serves": "2", "ing": [["🍗", "Boneless chicken thighs 2", "無骨雞髀 2隻"], ["🍶", "Soy sauce 3 tbsp", "豉油 3湯匙"], ["🍶", "Mirin 2 tbsp + sake 1 tbsp (or water)", "味醂 2湯匙、清酒 1湯匙（可用水代替）"], ["🍯", "Sugar or honey 1 tbsp", "糖或蜜糖 1湯匙"], ["🫚", "Ginger, grated 1 tsp", "薑蓉 1茶匙"], ["🍚", "Cooked rice 2 bowls", "白飯 2碗"], ["🥦", "Broccoli or greens, blanched", "西蘭花或青菜（灼熟）"], ["⚪", "Sesame seeds & spring onion", "芝麻、蔥花"]], "steps": [["Mix soy, mirin, sake, sugar and ginger for the sauce.", "豉油、味醂、清酒、糖、薑蓉調成醬汁。"], ["Pan-fry chicken skin-side down over medium heat 6 minutes, flip, 4 more minutes.", "雞髀皮向下中火煎6分鐘，反轉再煎4分鐘。"], ["Pour off excess fat, add sauce and simmer until thick and glossy, coating the chicken.", "倒走多餘油份，加醬汁煮至濃稠掛汁。"], ["Slice chicken, place on rice with vegetables; spoon over sauce, top with sesame and spring onion.", "雞肉切件放飯上，伴蔬菜，淋汁，撒芝麻蔥花。"]], "tip": "Simmer the sauce until it bubbles thickly — that's the shine. 醬汁煮至起大泡才有照燒光澤。"}, {"id": "r10", "cat": "lunch", "en": "Thai Basil Minced Pork (Pad Krapow)", "cn": "泰式打拋豬肉飯", "img": "https://i.ytimg.com/vi/9PDqMyFuuFQ/hqdefault.jpg", "ytid": "9PDqMyFuuFQ", "time": "20 min", "serves": "2", "ing": [["🐖", "Minced pork 300g", "免治豬肉 300克"], ["🌿", "Thai / holy basil leaves 1 big handful", "泰國羅勒/打拋葉 一大把"], ["🧄", "Garlic 4 cloves + bird's eye chilli 2, chopped", "蒜 4瓣、指天椒 2隻（剁碎）"], ["🍶", "Fish sauce 1 tbsp + oyster sauce 1 tbsp", "魚露 1湯匙、蠔油 1湯匙"], ["🍶", "Dark soy ½ tsp + sugar 1 tsp", "老抽半茶匙、糖 1茶匙"], ["🥚", "Fried egg 2 (optional)", "煎蛋 2隻（可加）"], ["🍚", "Cooked rice 2 bowls", "白飯 2碗"]], "steps": [["Pound or chop garlic and chilli; stir-fry in oil over high heat until fragrant.", "蒜和辣椒剁碎，大火爆香。"], ["Add minced pork, break it up and fry until browned.", "下免治豬肉炒散至微焦香。"], ["Season with fish sauce, oyster sauce, dark soy and sugar; add a splash of water.", "加魚露、蠔油、老抽、糖，灒少許水。"], ["Turn off heat, toss in basil until just wilted.", "熄火，拌入羅勒葉至剛軟。"], ["Serve over rice, topped with a crispy fried egg.", "盛飯上，加脆邊煎蛋。"]], "tip": "Basil goes in last — heat kills its aroma. 羅勒最後放，久煮會失香味。"}, {"id": "r11", "cat": "lunch", "en": "Korean Beef Bulgogi Bowl", "cn": "韓式烤牛肉飯", "img": "https://i.ytimg.com/vi/Gd46oK8GOlY/hqdefault.jpg", "ytid": "Gd46oK8GOlY", "time": "25 min + marinate", "serves": "2-3", "ing": [["🥩", "Beef (ribeye/sirloin), thinly sliced 400g", "牛肉薄片（肉眼/西冷）400克"], ["🍶", "Soy sauce 3 tbsp", "豉油 3湯匙"], ["🍐", "Grated pear or apple 3 tbsp", "梨蓉或蘋果蓉 3湯匙"], ["🧄", "Garlic, minced 3 cloves", "蒜蓉 3瓣"], ["🍯", "Sugar 1 tbsp + sesame oil 1 tbsp", "糖 1湯匙、麻油 1湯匙"], ["🧅", "Onion ½, sliced + spring onion", "洋蔥半個、蔥段"], ["🍚", "Rice, lettuce, sesame seeds to serve", "白飯、生菜、芝麻"]], "steps": [["Mix soy, pear, garlic, sugar and sesame oil; marinate beef 30 minutes (or overnight).", "豉油、梨蓉、蒜蓉、糖、麻油拌勻，醃牛肉30分鐘（過夜更佳）。"], ["Heat a pan until very hot; stir-fry beef and onion in batches without crowding.", "燒熱鑊，分批大火快炒牛肉和洋蔥。"], ["Cook until edges caramelise, about 2–3 minutes per batch.", "炒至邊緣微焦糖化，每批約2至3分鐘。"], ["Serve on rice with lettuce, sesame seeds and spring onion.", "盛飯上，配生菜、芝麻、蔥花。"]], "tip": "Grated pear tenderises the beef naturally. 梨蓉天然鬆肉又帶甜。"}, {"id": "r12", "cat": "lunch", "en": "Vietnamese Fresh Spring Rolls", "cn": "越南鮮蝦豬肉米紙卷", "img": "https://i.ytimg.com/vi/S2CZtOsI1gs/hqdefault.jpg", "ytid": "S2CZtOsI1gs", "time": "40 min", "serves": "3-4", "ing": [["🦐", "Shrimp, boiled & halved 12", "熟蝦（開邊）12隻"], ["🐖", "Pork belly or loin, boiled & sliced 200g", "豬腩肉或豬柳（灼熟切片）200克"], ["🍚", "Rice paper 12 sheets + rice vermicelli 100g", "米紙 12張、米粉 100克"], ["🥬", "Lettuce, mint, coriander", "生菜、薄荷、芫荽"], ["🥕", "Carrot & cucumber, julienned", "紅蘿蔔絲、青瓜絲"], ["🥜", "Peanut-hoisin dip: hoisin 3 tbsp + peanut butter 1 tbsp + warm water", "花生海鮮醬：海鮮醬3湯匙+花生醬1湯匙+溫水調開"]], "steps": [["Boil pork 20 minutes, slice thinly. Boil shrimp, halve lengthwise. Cook vermicelli.", "豬肉灼20分鐘切薄片；蝦灼熟開邊；米粉煮熟。"], ["Dip a rice paper sheet briefly in warm water and lay flat.", "米紙快速過溫水，平放。"], ["Layer lettuce, herbs, vermicelli, carrot, pork, then shrimp (pink side down).", "順序鋪生菜、香草、米粉、蘿蔔絲、豬肉，最後蝦（紅面向下）。"], ["Fold sides in and roll tightly.", "兩邊摺入，捲實。"], ["Serve with peanut-hoisin dipping sauce.", "伴花生海鮮醬食用。"]], "tip": "Don't over-soak the rice paper — 2 seconds is enough, it keeps softening. 米紙浸2秒即可，之後會繼續變軟。"}, {"id": "r13", "cat": "lunch", "en": "Chicken Penne in Tomato Basil Sauce", "cn": "番茄羅勒雞肉長通粉", "img": "https://i.ytimg.com/vi/kRXdQj69Uf8/hqdefault.jpg", "ytid": "kRXdQj69Uf8", "time": "30 min", "serves": "2-3", "ing": [["🍝", "Penne 250g", "長通粉 250克"], ["🍗", "Chicken breast, cubed 300g", "雞胸肉粒 300克"], ["🍅", "Canned crushed tomatoes 400g", "罐裝碎番茄 400克"], ["🧄", "Garlic 3 cloves + onion ½", "蒜 3瓣、洋蔥半個"], ["🌿", "Fresh basil 1 handful", "新鮮羅勒 一把"], ["🧀", "Parmesan, grated", "巴馬臣芝士碎"], ["🫒", "Olive oil, salt, pepper, pinch of sugar", "橄欖油、鹽、胡椒、少許糖"]], "steps": [["Cook penne al dente; reserve some pasta water.", "長通粉煮至彈牙，留少許煮麵水。"], ["Season and sear chicken cubes until golden; remove.", "雞粒調味煎至金黃，盛起。"], ["Sauté onion and garlic, add tomatoes, sugar, salt; simmer 10 minutes.", "炒香洋蔥蒜蓉，加碎番茄、糖、鹽，煮10分鐘。"], ["Return chicken, add penne and pasta water; toss.", "雞肉回鑊，加長通粉和煮麵水兜勻。"], ["Tear in basil, top with parmesan.", "加羅勒葉，撒芝士。"]], "tip": "A pinch of sugar balances tinned tomato acidity. 少許糖可中和罐頭番茄酸味。"}, {"id": "r14", "cat": "lunch", "en": "Thai Minced Pork Lettuce Wraps", "cn": "泰式肉碎生菜包", "img": "https://i.ytimg.com/vi/4mKaRnL4sUo/hqdefault.jpg", "ytid": "4mKaRnL4sUo", "time": "20 min", "serves": "2-3", "ing": [["🐖", "Minced pork 300g", "免治豬肉 300克"], ["🥬", "Iceberg or baby gem lettuce cups 8", "生菜杯 8片"], ["🧄", "Garlic, shallot, chilli (chopped)", "蒜、乾蔥、辣椒（剁碎）"], ["🍋", "Lime juice 2 tbsp + fish sauce 1½ tbsp", "青檸汁 2湯匙、魚露 1½湯匙"], ["🍯", "Sugar 1 tsp", "糖 1茶匙"], ["🌿", "Mint & coriander leaves", "薄荷、芫荽"], ["🥜", "Toasted rice powder or crushed peanuts 1 tbsp", "炒米粉或花生碎 1湯匙"]], "steps": [["Stir-fry garlic, shallot and chilli until fragrant.", "爆香蒜、乾蔥、辣椒。"], ["Add pork; fry until cooked through and lightly browned.", "下豬肉炒熟至微焦。"], ["Season with fish sauce, lime juice and sugar; turn off heat.", "加魚露、青檸汁、糖調味，熄火。"], ["Toss with mint, coriander and toasted rice powder.", "拌入薄荷、芫荽、炒米粉。"], ["Spoon into lettuce cups and serve.", "舀入生菜杯即成。"]], "tip": "This is from your saved video (HOMAYDO). 這是你收藏的影片食譜。"}, {"id": "r15", "cat": "lunch", "en": "Tom Yum Glass Noodles with Prawns", "cn": "冬蔭粉絲蝦煲", "img": "https://i.ytimg.com/vi/fqOxIHr87jY/hqdefault.jpg", "ytid": "fqOxIHr87jY", "time": "30 min", "serves": "2-3", "ing": [["🦐", "Large prawns 8-10", "大蝦 8至10隻"], ["🍜", "Glass noodles (mung bean vermicelli) 100g, soaked", "粉絲 100克（浸軟）"], ["🌶️", "Tom yum paste 2 tbsp", "冬蔭功醬 2湯匙"], ["🥥", "Coconut milk or evaporated milk 100ml", "椰奶或淡奶 100毫升"], ["🌿", "Lemongrass 1, kaffir lime leaves 3, galangal slices", "香茅1支、青檸葉3片、南薑片"], ["🍄", "Mushrooms 6", "蘑菇 6隻"], ["🍋", "Lime juice + fish sauce to taste", "青檸汁、魚露適量"]], "steps": [["Sear prawns in a little oil until half cooked; remove.", "蝦用少許油煎至半熟，盛起。"], ["Fry tom yum paste with lemongrass, galangal and lime leaves until fragrant.", "炒香冬蔭功醬、香茅、南薑、青檸葉。"], ["Add 500ml water, mushrooms; simmer 5 minutes, add coconut milk.", "加水500毫升、蘑菇煮5分鐘，加椰奶。"], ["Add soaked glass noodles; simmer until + salt", "水 2.5公升、鹽適量"]], "steps": [["Blanch pork bones; rinse.", "豬骨汆水沖淨。"], ["Put all ingredients except salt into boiling water.", "除鹽外全部材料放入滾水。"], ["Boil hard 10 minutes, then simmer 1.5–2 hours.", "大火10分鐘，細火煲1.5至2小時。"], ["Season with salt before serving.", "飲前落鹽。"]], "tip": "Sweet, cooling, classic weekly soup. 清熱下火，最經典嘅家常老火湯。"}, {"id": "r22", "cat": "soup", "en": "Lotus Root, Dried Octopus & Peanut Soup", "cn": "蓮藕章魚花生湯", "img": "https://i.ytimg.com/vi/U5xopBg41vo/hqdefault.jpg", "ytid": "U5xopBg41vo", "time": "2 hr", "serves": "4-6", "ing": [["🪷", "Lotus root 500g, thick slices", "蓮藕 500克（切厚片）"], ["🦑", "Dried octopus 1, soaked 30 min", "乾章魚 1隻（浸30分鐘）"], ["🥜", "Peanuts 60g + black-eyed peas 40g", "花生60克、眉豆40克"], ["🐖", "Pork bones or lean pork 400g", "豬骨或瘦肉 400克"], ["🍊", "Dried tangerine peel 1 piece + ginger 2 slices", "陳皮1角、薑2片"], ["💧", "Water 2.5L + salt", "水 2.5公升、鹽適量"]], "steps": [["Soak octopus; blanch pork; soak peanuts and peas 1 hour.", "章魚浸軟；豬骨汆水；花生眉豆浸1小時。"], ["Lightly toast the octopus in a dry pan until fragrant (optional but better).", "章魚白鑊烘香（可省但更香）。"], ["Put everything except salt in boiling water; boil 10 minutes, simmer 1.5–2 hours.", "除鹽外落煲，大火10分鐘，細火煲1.5至2小時。"], ["Season with salt.", "飲前落鹽。"]], "tip": "Octopus + lotus root gives the classic sweet 'old fire' flavour. 章魚配蓮藕，湯水鮮甜格外惹味。"}, {"id": "r23", "cat": "soup", "en": "Sweet Corn & Fish Maw Thick Soup", "cn": "粟米魚肚羹", "img": "https://i.ytimg.com/vi/BwncWFHdZJQ/hqdefault.jpg", "ytid": "BwncWFHdZJQ", "time": "40 min", "serves": "4", "ing": [["🌽", "Creamed corn 1 can + fresh corn kernels ½ cup", "粟米蓉1罐、鮮粟米粒半杯"], ["🐟", "Fish maw 60g (soaked & cut small)", "魚肚 60克（浸發剪小）"], ["🍗", "Chicken breast, shredded 100g (optional)", "雞胸肉絲 100克（可加）"], ["🥚", "Egg whites 2, beaten", "蛋白 2隻（打勻）"], ["🍲", "Chicken stock 800ml + ginger 2 slices", "雞湯800毫升、薑2片"], ["🌽", "Cornstarch 2 tbsp + water 3 tbsp", "粟粉2湯匙、水3湯匙"], ["🧂", "Salt, white pepper, sesame oil", "鹽、白胡椒粉、麻油"]], "steps": [["Soak fish maw until soft, squeeze dry, cut into small pieces; blanch with ginger to remove smell.", "魚肚浸軟揸乾剪小件，用薑水灼過辟味。"], ["Bring stock to a boil; add creamed corn, corn kernels, fish maw and chicken.", "雞湯煮滾，加粟米蓉、粟米粒、魚肚、雞絲。"], ["Simmer 10 minutes; thicken with cornstarch slurry.", "煮10分鐘，粟粉水埋芡。"], ["Turn heat low; stream in egg whites while stirring slowly for silky ribbons.", "轉細火，慢慢倒入蛋白同時輕攪成蛋花。"], ["Season with salt, pepper and sesame oil.", "加鹽、白胡椒粉、麻油調味。"]], "tip": "Stir slowly when adding egg white — that's what makes silky ribbons. 落蛋白時慢攪，蛋花先幼滑。"}, {"id": "r24", "cat": "appetizer", "en": "Steamed Tofu with Shrimp & Garlic Sauce", "cn": "蒜蓉蝦仁蒸豆腐", "img": "WhatsApp Image 2026-07-09 at 10.48.15 AM.jpeg", "ytid": "TxBHFw5QNnU", "time": "20 min", "serves": "3-4", "ing": [["🧈", "Soft tofu 1 block, cut into squares", "嫩豆腐 1磚（切方塊）"], ["🦐", "Shrimp, peeled 12", "蝦仁 12隻"], ["🧄", "Garlic, minced 3 tbsp", "蒜蓉 3湯匙"], ["🍶", "Light soy 1 tbsp + oyster sauce 1 tsp + sugar ½ tsp", "生抽1湯匙、蠔油1茶匙、糖半茶匙"], ["🌽", "Cornstarch ½ tsp (for shrimp)", "粟粉半茶匙（醃蝦）"], ["🧅", "Spring onion, chopped", "蔥花"], ["🫒", "Oil 2 tbsp", "油 2湯匙"]], "steps": [["Arrange tofu squares on a plate; place one marinated shrimp on each.", "豆腐排碟，每件豆腐放一隻醃好的蝦仁。"], ["Fry half the garlic in oil until golden; mix with raw garlic, soy, oyster sauce and sugar.", "一半蒜蓉炸至金黃，與生蒜、生抽、蠔油、糖拌成醬。"], ["Spoon garlic sauce over each piece.", "每件淋上蒜蓉醬。"], ["Steam over high heat 6–8 minutes.", "大火蒸6至8分鐘。"], ["Pour away excess water, top with spring onion and a drizzle of hot oil.", "倒走多餘水分，撒蔥花，淋少許熱油。"]], "tip": "Half-fried, half-raw garlic gives the classic 金銀蒜 flavour. 金銀蒜（半生半炸）最香。"}, {"id": "r25", "cat": "appetizer", "en": "Stuffed Hairy Gourd Rings with Pork & Mushroom", "cn": "豬肉冬菇釀節瓜", "img": "WhatsApp Image 2026-07-15 at 10.10.59 AM.jpeg", "ytid": "T2GfO55-AAI", "time": "40 min", "serves": "3-4", "ing": [["🥒", "Hairy gourd (節瓜) 2, cut into 4cm rings, cored", "節瓜 2條（切4厘米圈，去芯）"], ["🐖", "Minced pork 250g", "免治豬肉 250克"], ["🍄", "Dried shiitake 4, soaked & diced", "冬菇 4隻（浸軟切粒）"], ["🧅", "Water chestnuts or spring onion, chopped", "馬蹄或蔥（切碎）"], ["🍶", "Soy 2 tsp + oyster sauce 1 tsp + sesame oil + white pepper", "生抽2茶匙、蠔油1茶匙、麻油、白胡椒粉"], ["🌽", "Cornstarch 2 tsp + more for dusting", "粟粉2茶匙、另備少許撲粉"], ["💧", "Stock 150ml for the glaze", "上湯150毫升（打芡用）"]], "steps": [["Mix pork with mushrooms, water chestnut, seasonings and cornstarch; stir one direction until sticky.", "豬肉加冬菇、馬蹄、調味、粟粉，同一方向攪至起膠。"], ["Peel gourd, cut rings, remove core; dust inside with cornstarch.", "節瓜去皮切圈去芯，內圈撲粟粉。"], ["Fill each ring with pork mixture, mounding slightly.", "釀入肉餡，稍微隆起。"], ["Steam 15 minutes (or pan-fry then braise).", "大火蒸15分鐘（或煎香後炆）。"], ["Thicken the plate juices + stock with cornstarch; pour over.", "蒸出的汁加上湯埋芡，淋面。"]], "tip": "Stir the filling one direction only — it binds better. 餡料順一個方向攪先夠黏。"}, {"id": "r26", "cat": "appetizer", "en": "Teochew Cold Fish (Grey Mullet / Threadfin)", "cn": "潮式凍烏頭 / 凍馬友", "img": "WhatsApp Image 2026-06-20 at 1.18.31 PM.jpeg", "ytid": "rqWolol-F3c", "time": "25 min + chill", "serves": "3-4", "ing": [["🐟", "Grey mullet or threadfin (馬友) 1, cleaned", "烏頭或馬友 1條（劏淨）"], ["🧂", "Coarse salt 1 tbsp", "粗鹽 1湯匙"], ["🫚", "Ginger 3 slices + spring onion 2", "薑3片、蔥2條"], ["🫘", "Puning bean sauce (普寧豆醬) for dipping", "普寧豆醬（蘸食）"]], "steps": [["Rub fish lightly with salt inside and out.", "魚身內外抹少許鹽。"], ["Steam or poach with ginger and spring onion 10–12 minutes until just cooked.", "加薑蔥蒸或浸煮10至12分鐘至剛熟。"], ["Cool to room temperature, then refrigerate at least 2 hours.", "放涼後入雪櫃冷藏至少2小時。"], ["Serve cold with Puning bean sauce.", "凍食，配普寧豆醬。"]], "tip": "Chilling firms the flesh and brings out sweetness — classic 潮州魚飯. 凍食魚肉更結實鮮甜，正宗潮州魚飯食法。"}, {"id": "r27", "cat": "main", "en": "Soy Sauce Chicken", "cn": "豉油雞", "img": "WhatsApp Image 2026-06-20 at 1.16.03 PM.jpeg", "ytid": "Ib7yiYa65lM", "time": "50 min", "serves": "4", "ing": [["🐔", "Whole chicken 1 (about 1.5kg) or chicken legs 4", "光雞 1隻（約1.5公斤）或雞髀 4隻"], ["🍶", "Light soy 250ml + dark soy 60ml", "生抽 250毫升、老抽 60毫升"], ["🍚", "Rose wine (玫瑰露) or Shaoxing wine 2 tbsp", "玫瑰露或紹興酒 2湯匙"], ["🍬", "Rock sugar 60g", "冰糖 60克"], ["🫚", "Ginger 4 slices + spring onion 3 + garlic 3 cloves", "薑4片、蔥3條、蒜3瓣"], ["🌟", "Star anise 2 + cinnamon 1 stick + bay leaf 2", "八角2粒、桂皮1支、香葉2片"], ["💧", "Water 600ml", "水 600毫升"]], "steps": [["Simmer all sauce ingredients 10 minutes to make the master stock.", "所有滷汁材料煮10分鐘成豉油滷水。"], ["Lower in the chicken breast-side down; simmer gently 15 minutes covered.", "雞胸向下放入，加蓋細火浸煮15分鐘。"], ["Turn chicken over; simmer 15 more minutes, spooning sauce over.", "反轉再煮15分鐘，不時淋汁。"], ["Turn off heat and let it steep 15 minutes in the covered pot.", "熄火加蓋焗15分鐘。"], ["Rest 10 minutes, chop and pour over some sauce.", "取出稍涼斬件，淋上滷汁。"]], "tip": "Gentle steeping (not boiling) keeps the meat juicy. 浸熟唔係滾熟，肉先嫩滑多汁。"}, {"id": "r28", "cat": "main", "en": "Braised Pork Ribs with Lotus Root", "cn": "蓮藕炆排骨", "img": "WhatsApp Image 2026-06-20 at 1.16.42 PM.jpeg", "ytid": "-E79Cqx-8mc", "time": "1 hr", "serves": "4", "ing": [["🍖", "Pork ribs 600g, cut into pieces", "排骨 600克（切件）"], ["🪷", "Lotus root 400g, thick slices", "蓮藕 400克（切厚片）"], ["🫚", "Ginger 3 slices + garlic 3 cloves + shallot 2", "薑3片、蒜3瓣、乾蔥2粒"], ["🍶", "Light soy 2 tbsp + dark soy 1 tbsp + oyster sauce 1 tbsp", "生抽2湯匙、老抽1湯匙、蠔油1湯匙"], ["🍚", "Shaoxing wine 1 tbsp + rock sugar small piece", "紹興酒1湯匙、冰糖一小粒"], ["💧", "Water to just cover", "水（浸過材料面）"], ["🧅", "Spring onion to garnish", "蔥花裝飾"]], "steps": [["Blanch ribs; rinse and pat dry.", "排骨汆水，沖淨抹乾。"], ["Brown ribs with ginger, garlic and shallot in a little oil.", "少許油爆香薑蒜乾蔥，排骨煎至微黃。"], ["Splash in wine; add soys, oyster sauce and rock sugar.", "灒酒，加生抽、老抽、蠔油、冰糖。"], ["Add lotus root and water to cover; simmer covered 40–45 minutes.", "加蓮藕和水浸面，加蓋炆40至45分鐘。"], ["Uncover and reduce the sauce until glossy; garnish with spring onion.", "開蓋收汁至濃稠，撒蔥花。"]], "tip": "Thick-cut lotus root stays crunchy-tender after braising. 蓮藕切厚片，炆完粉糯帶爽。"}, {"id": "r29", "cat": "main", "en": "Cantonese Steamed Fish", "cn": "清蒸魚（薑蔥）", "img": "WhatsApp Image 2026-07-23 at 7.07.17 PM.jpeg", "ytid": "NaiL0SeTz_s", "time": "20 min", "serves": "2-3", "ing": [["🐟", "Whole fish (pomfret, croaker, sea bass…) 1, about 600g", "鮮魚一條（白鯧/黃花魚/鱸魚）約600克"], ["🫚", "Ginger, half sliced half julienned", "薑（半切片半切絲）"], ["🧅", "Spring onion 3, sectioned & julienned", "蔥3條（段+絲）"], ["🍶", "Steamed fish soy sauce 3 tbsp", "蒸魚豉油 3湯匙"], ["🫒", "Oil 2 tbsp", "油 2湯匙"], ["🌶️", "Red chilli / coriander (optional)", "紅椒絲/芫荽（可加）"]], "steps": [["Clean fish, pat very dry; lay ginger slices and spring onion under and inside it.", "魚劏淨抹乾，薑片蔥段墊底和放入魚肚。"], ["Steam over high heat: 8–10 minutes for a 600g fish. Do not open the lid midway.", "大火蒸8至10分鐘（600克魚），中途不開蓋。"], ["Pour away the fishy liquid; discard old ginger and onion.", "倒走蒸魚水，棄去薑蔥。"], ["Top with fresh ginger and spring onion julienne; pour over smoking-hot oil.", "鋪上新薑絲蔥絲，淋滾油。"], ["Drizzle steamed-fish soy around the fish and serve at once.", "沿碟邊淋蒸魚豉油，即上桌。"]], "tip": "Check doneness at the thickest part — flesh should just flake off the bone. 魚背最厚處肉離骨即熟。"}, {"id": "r30", "cat": "main", "en": "Shredded Pork with Green Peppers", "cn": "青椒炒肉絲", "img": "WhatsApp Image 2026-06-20 at 1.15.44 PM.jpeg", "ytid": "mcn1I6R7ufA", "time": "20 min", "serves": "3", "ing": [["🐖", "Pork loin, shredded 300g", "豬柳肉切絲 300克"], ["🫑", "Green peppers 2 + red pepper ½, shredded", "青椒2個、紅椒半個（切絲）"], ["🧄", "Garlic 2 cloves + ginger shreds", "蒜2瓣、薑絲"], ["🍶", "Marinade: soy 1 tbsp, wine 1 tsp, cornstarch 2 tsp, water 1 tbsp", "醃料：生抽1湯匙、酒1茶匙、粟粉2茶匙、水1湯匙"], ["🍶", "Sauce: oyster sauce 1 tbsp + soy 1 tsp + sugar ½ tsp", "汁：蠔油1湯匙、生抽1茶匙、糖半茶匙"], ["🫒", "Oil 3 tbsp", "油 3湯匙"]], "steps": [["Marinate pork shreds 15 minutes.", "肉絲醃15分鐘。"], ["Stir-fry pork in 2 tbsp oil until it just changes colour; remove.", "2湯匙油炒肉絲至剛轉色，盛起。"], ["Stir-fry peppers with a pinch of salt 1 minute.", "青紅椒加少許鹽炒1分鐘。"], ["Return pork with garlic and ginger; add sauce.", "肉絲回鑊，加蒜薑和汁料。"], ["Toss over high heat 30 seconds and serve.", "大火兜勻30秒上碟。"]], "tip": "Water + cornstarch in the marinade keeps pork silky (velveting). 醃料加水和粟粉，肉絲先夠嫩滑。"}, {"id": "r31", "cat": "main", "en": "Stir-fried Chicken with Lily Bulb & Asparagus", "cn": "雞片炒百合蘆筍", "img": "WhatsApp Image 2026-07-15 at 10.11.17 AM.jpeg", "ytid": "w4DiW9m1D9Q", "time": "20 min", "serves": "3", "ing": [["🍗", "Chicken breast, sliced 300g", "雞胸肉切片 300克"], ["🌷", "Fresh lily bulbs 2, petals separated", "鮮百合 2個（拆瓣）"], ["🥬", "Asparagus 8, cut into sections", "蘆筍 8條（切段）"], ["🔴", "Goji berries 1 tbsp (soaked)", "杞子 1湯匙（浸軟）"], ["🧄", "Garlic 2 cloves + ginger 2 slices", "蒜2瓣、薑2片"], ["🍶", "Marinade: soy 2 tsp, cornstarch 1 tsp, water 1 tbsp", "醃料：生抽2茶匙、粟粉1茶匙、水1湯匙"], ["🧂", "Salt, sugar pinch, sesame oil", "鹽、糖少許、麻油"]], "steps": [["Marinate chicken slices 15 minutes; blanch asparagus 30 seconds.", "雞片醃15分鐘；蘆筍灼30秒。"], ["Stir-fry chicken in oil until 80% cooked; remove.", "雞片炒至八成熟，盛起。"], ["Sauté garlic and ginger; add asparagus and lily bulbs, fry 1 minute.", "爆香蒜薑，下蘆筍百合炒1分鐘。"], ["Return chicken with goji berries; season with salt and sugar.", "雞片回鑊加杞子，鹽糖調味。"], ["Finish with a few drops of sesame oil.", "最後灑幾滴麻油。"]], "tip": "Lily bulbs only need a minute — overcooking turns them grey. 百合炒1分鐘即可，過火會變灰腍。"}, {"id": "r32", "cat": "main", "en": "Stir-fried Celtuce with Garlic", "cn": "蒜香炒萵筍", "img": "WhatsApp Image 2026-04-16 at 2.38.57 PM.jpeg", "ytid": "xtN4GlI4r84", "time": "12 min", "serves": "3", "ing": [["🥬", "Celtuce (萵筍) 1, peeled & sliced diagonally", "萵筍 1條（去皮斜切片）"], ["🥬", "Celtuce leaves (tender part), sectioned", "萵筍嫩葉（切段）"], ["🧄", "Garlic, sliced 4 cloves", "蒜片 4瓣"], ["🧂", "Salt ½ tsp + sugar pinch", "鹽半茶匙、糖少許"], ["🫒", "Oil 2 tbsp", "油 2湯匙"], ["💧", "Water 2 tbsp", "水 2湯匙"]], "steps": [["Peel celtuce stem thoroughly (remove all fibrous skin); slice thinly on the diagonal.", "萵筍徹底去皮（纖維外皮要去清），斜切薄片。"], ["Heat oil, fry garlic until fragrant.", "燒油爆香蒜片。"], ["Add celtuce slices, stir-fry over high heat 1–2 minutes.", "下萵筍片大火炒1至2分鐘。"], ["Add leaves, salt, sugar and a splash of water; toss until just tender-crisp.", "加嫩葉、鹽、糖、少許水，炒至剛爽腍。"]], "tip": "Keep it crisp — celtuce should still have bite. 萵筍要保持爽脆口感。"}, {"id": "r33", "cat": "appetizer", "en": "Braised Japanese Eggplant", "cn": "紅燒日本茄子", "img": "WhatsApp Image 2026-07-09 at 10.43.00 AM.jpeg", "ytid": "4UVPEbmb1Tg", "time": "25 min", "serves": "3", "ing": [["🍆", "Japanese eggplants 2, cut into batons", "日本茄子 2條（切條）"], ["🧄", "Garlic 4 cloves + ginger 2 slices, minced", "蒜4瓣、薑2片（剁碎）"], ["🍶", "Soy 2 tbsp + oyster sauce 1 tbsp + sugar 1 tsp", "生抽2湯匙、蠔油1湯匙、糖1茶匙"], ["💧", "Water 100ml + cornstarch 1 tsp", "水100毫升、粟粉1茶匙"], ["🧅", "Spring onion, chopped", "蔥花"], ["🫒", "Oil 3 tbsp", "油 3湯匙"], ["🧂", "Salt (for soaking)", "鹽（浸茄子用）"]], "steps": [["Soak eggplant batons in salted water 10 minutes; drain and pat dry (less oil absorbed).", "茄子條浸鹽水10分鐘，隔水抹乾（減少吸油）。"], ["Pan-fry eggplant in oil until soft and golden; remove.", "茄子煎至軟身金黃，盛起。"], ["Sauté garlic and ginger; add sauce mixture and bring to a boil.", "爆香蒜薑，加醬汁煮滾。"], ["Return eggplant; simmer 3–4 minutes, thicken with cornstarch slurry.", "茄子回鑊煮3至4分鐘，粟粉水埋芡。"], ["Top with spring onion.", "撒蔥花。"]], "tip": "Salt-water soak stops the eggplant drinking oil. 鹽水浸過的茄子唔會狂吸油。"}, {"id": "r34", "cat": "main", "en": "Steamed Pork Patty with Water Chestnut", "cn": "馬蹄蒸肉餅", "img": "https://i.ytimg.com/vi/yNtqS7FKQ_U/hqdefault.jpg", "ytid": "yNtqS7FKQ_U", "time": "30 min", "serves": "3-4", "ing": [["🐖", "Minced pork (80% lean, 20% fat) 300g", "免治豬肉（八瘦二肥）300克"], ["🌰", "Water chestnuts 6, peeled & roughly chopped", "馬蹄 6粒（去皮拍碎切粒）"], ["🍄", "Dried shiitake 2, soaked & diced (optional)", "冬菇 2隻（浸軟切粒，可加）"], ["🍶", "Light soy 1 tbsp + oyster sauce 1 tsp + sugar ½ tsp", "生抽1湯匙、蠔油1茶匙、糖半茶匙"], ["🌽", "Cornstarch 2 tsp + water 3 tbsp", "粟粉2茶匙、水3湯匙"], ["🫚", "Ginger juice 1 tsp + white pepper + sesame oil", "薑汁1茶匙、白胡椒粉、麻油"], ["🧅", "Spring onion, chopped", "蔥花"]], "steps": [["Season pork with soy, oyster sauce, sugar, ginger juice and pepper.", "豬肉加生抽、蠔油、糖、薑汁、胡椒粉調味。"], ["Add water a spoon at a time, stirring one direction until absorbed; mix in cornstarch — this makes it juicy and springy.", "分次加水順一方向攪至吸收，再加粟粉——肉餅先會多汁鬆軟。"], ["Fold in water chestnuts and mushrooms.", "拌入馬蹄粒和冬菇粒。"], ["Spread loosely on a shallow plate — don't press it flat and dense.", "肉餅平鋪淺碟，切勿壓實。"], ["Steam over high heat 12–15 minutes; top with spring onion and sesame oil.", "大火蒸12至15分鐘，撒蔥花、淋麻油。"]], "tip": "Adding water slowly + one-direction stirring = the juicy, fluffy secret. 慢慢加水順一方向攪，就是多汁鬆軟的秘訣。"}, {"id": "r35", "cat": "main", "en": "Mixed Vegetable Stir-fry", "cn": "快炒什錦菜", "img": "WhatsApp Image 2026-06-20 at 1.20.31 PM.jpeg", "ytid": "2D0-1KHSCYU", "time": "15 min", "serves": "3-4", "ing": [["🥬", "Asparagus 6 + celery 2 stalks, sectioned", "蘆筍6條、西芹2條（切段）"], ["🌽", "Baby corn 8, halved", "玉米筍 8條（開邊）"], ["🥕", "Carrot ½, sliced", "紅蘿蔔半條（切片）"], ["🍄", "Mushrooms 6, sliced", "蘑菇 6隻（切片）"], ["🫑", "Red pepper ½", "紅椒半個"], ["🧄", "Garlic 3 cloves", "蒜 3瓣"], ["🍶", "Oyster sauce 1 tbsp + soy 1 tsp + sugar pinch", "蠔油1湯匙、生抽1茶匙、糖少許"], ["💧", "Water/stock 3 tbsp + cornstarch ½ tsp", "水或上湯3湯匙、粟粉半茶匙"]], "steps": [["Blanch carrot, baby corn and asparagus 1 minute; drain.", "紅蘿蔔、玉米筍、蘆筍灼1分鐘，隔水。"], ["Stir-fry garlic in oil; add all vegetables over high heat.", "爆香蒜片，大火下所有蔬菜。"], ["Add sauce and toss 2 minutes.", "加汁料炒2分鐘。"], ["Thicken with cornstarch slurry so the sauce coats the vegetables.", "粟粉水埋薄芡令汁掛菜。"]], "tip": "Blanching first keeps every vegetable evenly crisp. 先灼硬身菜，落鑊炒先會生熟一致。"}, {"id": "r36", "cat": "main", "en": "Steamed Chicken with Shiitake Mushroom", "cn": "冬菇蒸雞", "img": "https://i.ytimg.com/vi/jQcTRGvD6_0/hqdefault.jpg", "ytid": "jQcTRGvD6_0", "time": "30 min", "serves": "3-4", "ing": [["🍗", "Chicken thighs, chopped 500g", "雞髀切件 500克"], ["🍄", "Dried shiitake 6, soaked & halved", "冬菇 6隻（浸軟開半）"], ["🔴", "Goji berries 1 tbsp + red dates 3, shredded", "杞子1湯匙、紅棗3粒切絲"], ["🫚", "Ginger shreds 1 tbsp", "薑絲 1湯匙"], ["🍶", "Soy 1½ tbsp + oyster sauce 1 tbsp + wine 1 tbsp + sugar ½ tsp", "生抽1½湯匙、蠔油1湯匙、酒1湯匙、糖半茶匙"], ["🌽", "Cornstarch 2 tsp + sesame oil 1 tsp", "粟粉2茶匙、麻油1茶匙"], ["🧅", "Spring onion", "蔥花"]], "steps": [["Marinate chicken with all seasonings, mushrooms and ginger 20 minutes.", "雞件加調味、冬菇、薑絲醃20分鐘。"], ["Spread flat on a shallow plate; scatter dates and goji.", "平鋪淺碟，放紅棗絲、杞子。"], ["Steam over high heat 15–18 minutes until juices run clear.", "大火蒸15至18分鐘至熟透。"], ["Top with spring onion.", "撒蔥花。"]], "tip": "Mushroom soaking water can go into the marinade for extra flavour. 浸冬菇水可加入醃料更香。"}, {"id": "r37", "cat": "main", "en": "Tomato Scrambled Eggs", "cn": "番茄炒蛋", "img": "https://i.ytimg.com/vi/uElf3xvmYXA/hqdefault.jpg", "ytid": "uElf3xvmYXA", "time": "10 min", "serves": "2-3", "ing": [["🍅", "Ripe tomatoes 3, wedges", "熟番茄 3個（切角）"], ["🥚", "Eggs 4", "雞蛋 4隻"], ["🧂", "Salt ½ tsp + sugar 1 tsp", "鹽半茶匙、糖1茶匙"], ["🍶", "Ketchup 1 tbsp (optional)", "茄汁 1湯匙（可加）"], ["🧅", "Spring onion", "蔥花"], ["🫒", "Oil 3 tbsp", "油 3湯匙"]], "steps": [["Scramble seasoned eggs over medium heat until 70% set; remove.", "蛋液加鹽炒至七成熟，盛起。"], ["Fry tomatoes with salt and sugar until juicy and saucy.", "番茄加鹽糖炒至出汁。"], ["Return eggs, add ketchup if using, fold gently 30 seconds.", "雞蛋回鑊，可加茄汁，輕兜30秒。"], ["Top with spring onion; serve with rice.", "撒蔥花，配飯食。"]], "tip": "Take the eggs out early — they finish in the tomato sauce. 蛋早啲盛起，回鑊先至嫩。"}, {"id": "r38", "cat": "main", "en": "Blanched Prawns with Dipping Sauce", "cn": "白灼蝦", "img": "https://i.ytimg.com/vi/kN_eMzoJJmA/hqdefault.jpg", "ytid": "kN_eMzoJJmA", "time": "15 min", "serves": "3-4", "ing": [["🦐", "Fresh whole prawns 500g", "鮮蝦 500克"], ["🫚", "Ginger 3 slices + spring onion 2", "薑3片、蔥2條"], ["🍶", "Shaoxing wine 1 tbsp", "紹興酒 1湯匙"], ["🥣", "Dip: soy 3 tbsp + sliced chilli + shredded ginger + hot oil 1 tbsp", "蘸汁：豉油3湯匙+辣椒圈+薑絲+熱油1湯匙"]], "steps": [["Bring water to a rolling boil with ginger, spring onion and wine.", "水加薑蔥酒煮至大滾。"], ["Add prawns; cook 2 minutes (3–4 if very large) until just curled and pink.", "落蝦煮2分鐘（大蝦3至4分鐘）至捲曲轉紅。"], ["Optional: plunge into iced water 30 seconds for bouncy texture.", "可過冰水30秒，肉質更爽。"], ["Make the dip: pour hot oil over soy, chilli and ginger.", "熱油淋豉油、辣椒、薑絲成蘸汁。"]], "tip": "Don't overcook — the moment they curl into a C-shape, they're done. 蝦捲成C形即熟，過火會韌。"}, {"id": "r39", "cat": "main", "en": "Bitter Melon Beef in Black Bean Sauce", "cn": "豆豉苦瓜炒牛肉", "img": "https://i.ytimg.com/vi/rmf96VSrOOM/hqdefault.jpg", "ytid": "rmf96VSrOOM", "time": "25 min", "serves": "3", "ing": [["🥒", "Bitter melon 1, deseeded & sliced", "苦瓜 1個（去籽切片）"], ["🥩", "Beef, thinly sliced 300g", "牛肉薄片 300克"], ["🫘", "Fermented black beans 1 tbsp, rinsed & mashed", "豆豉 1湯匙（洗淨壓碎）"], ["🧄", "Garlic 3 cloves + ginger 2 slices", "蒜3瓣、薑2片"], ["🍶", "Marinade: soy 1 tbsp + sugar ½ tsp + cornstarch 2 tsp + water 2 tbsp + oil", "醃料：生抽1湯匙、糖半茶匙、粟粉2茶匙、水2湯匙、油"], ["🍶", "Oyster sauce 1 tbsp + sugar ½ tsp", "蠔油1湯匙、糖半茶匙"]], "steps": [["Marinate beef 20 minutes. Slice bitter melon thinly; blanch 1 minute in salted water (less bitter).", "牛肉醃20分鐘；苦瓜切薄片鹽水灼1分鐘（減苦味）。"], ["Sear beef over high heat until 80% done; remove.", "大火炒牛肉至八成熟，盛起。"], ["Fry garlic, ginger and black beans until fragrant; add bitter melon 2 minutes.", "爆香蒜薑豆豉，下苦瓜炒2分鐘。"], ["Return beef with oyster sauce and sugar; toss 30 seconds.", "牛肉回鑊加蠔油糖，兜勻30秒。"]], "tip": "Blanching + a little sugar tames the bitterness. 汆水加少少糖，苦味啱啱好。"}, {"id": "r40", "cat": "dessert", "en": "Papaya & Snow Fungus Sweet Soup", "cn": "木瓜雪耳糖水", "img": "https://i.ytimg.com/vi/JgNhZy7YHIU/hqdefault.jpg", "ytid": "JgNhZy7YHIU", "time": "1 hr", "serves": "4", "ing": [["🥭", "Ripe papaya ½, cubed", "熟木瓜 半個（切粒）"], ["🍄", "Snow fungus 1, soaked & torn", "雪耳 1朵（浸發撕小）"], ["🌰", "South & north apricot kernels 1 tbsp", "南北杏 1湯匙"], ["🌰", "Lotus seeds 30g (optional)", "蓮子 30克（可加）"], ["🍬", "Rock sugar 60g (to taste)", "冰糖 60克（隨口味）"], ["💧", "Water 1.5L", "水 1.5公升"]], "steps": [["Soak snow fungus 30 minutes, trim yellow core, tear small.", "雪耳浸30分鐘，去黃芯撕小朵。"], ["Simmer snow fungus, apricot kernels and lotus seeds 40 minutes until gluey.", "雪耳、南北杏、蓮子煲40分鐘至出膠。"], ["Add papaya and rock sugar; simmer 10 more minutes.", "加木瓜和冰糖，再煮10分鐘。"], ["Serve warm or chilled.", "熱食或凍食皆可。"]], "tip": "Long simmering makes snow fungus silky like bird's nest. 雪耳煲耐先滑，係平民燕窩。"}, {"id": "r41", "cat": "dessert", "en": "Red Bean Sweet Soup with Tangerine Peel", "cn": "陳皮紅豆沙", "img": "https://i.ytimg.com/vi/F1AL9UJBwVE/hqdefault.jpg", "ytid": "F1AL9UJBwVE", "time": "1.5 hr", "serves": "4-6", "ing": [["🫘", "Red beans 250g, soaked 2 hours", "紅豆 250克（浸2小時）"], ["🍊", "Aged tangerine peel 1 piece, soaked & scraped", "陳皮 1角（浸軟刮瓤）"], ["🌰", "Lotus seeds 50g (optional)", "蓮子 50克（可加）"], ["🍬", "Slab sugar or rock sugar 80–100g", "片糖或冰糖 80至100克"], ["💧", "Water 1.8L", "水 1.8公升"]], "steps": [["Boil red beans and tangerine peel in water; simmer 1–1.5 hours until beans burst into 'sand'.", "紅豆、陳皮加水煮滾，細火煲1至1.5小時至起沙。"], ["Add lotus seeds halfway if using.", "蓮子中途加入。"], ["Stir in sugar at the end, simmer 10 minutes.", "最後落糖，再煮10分鐘。"], ["Serve hot.", "趁熱食。"]], "tip": "Sugar goes in LAST — adding early stops beans softening. 糖最後落，早落豆唔腍。"}, {"id": "r42", "cat": "dessert", "en": "Black Sesame Sweet Soup", "cn": "芝麻糊", "img": "https://i.ytimg.com/vi/GiAzagniAW4/hqdefault.jpg", "ytid": "GiAzagniAW4", "time": "30 min", "serves": "3-4", "ing": [["⚫", "Black sesame seeds 100g, toasted", "黑芝麻 100克（炒香）"], ["🍚", "Rice 40g, soaked (or glutinous rice flour 3 tbsp)", "白米 40克浸軟（或糯米粉3湯匙）"], ["🍬", "Rock sugar 60g", "冰糖 60克"], ["💧", "Water 800ml", "水 800毫升"]], "steps": [["Toast sesame seeds in a dry pan over low heat until fragrant (do not burn).", "白鑊細火炒香黑芝麻（切勿炒燶）。"], ["Blend sesame, soaked rice and water until completely smooth.", "黑芝麻、米、水用攪拌機打至幼滑。"], ["Strain into a pot; cook over medium-low heat, stirring constantly.", "過篩入煲，中細火邊煮邊攪。"], ["Add rock sugar; simmer until thick and glossy.", "加冰糖煮至濃稠有光澤。"]], "tip": "Stir non-stop once it heats — it catches on the bottom easily. 加熱後要不停攪，好易黐底。"}]).concat([{"id": "r43", "cat": "baby", "en": "First Carrot Purée (from ~6 months)", "cn": "紅蘿蔔蓉（約6個月起）", "img": "", "ytid": "", "time": "20 min", "serves": "2-3 baby portions", "ing": [["🥕", "Carrot 1, peeled and chopped", "紅蘿蔔 1條（去皮切塊）"], ["💧", "Cooled boiled water or breast milk / formula, a little", "涼開水、母乳或配方奶 少許"]], "steps": [["Steam the carrot 12–15 minutes until it mashes easily with a fork.", "紅蘿蔔蒸12至15分鐘，用叉可輕易壓爛。"], ["Blend or press through a sieve, adding a little water or milk until it is smooth and runny.", "攪拌或過篩，逐少加水或奶，調至順滑稀身。"], ["Cool to lukewarm. Offer 1–2 teaspoons at first, once a day.", "放至微溫。初次只餵1至2茶匙，每日一次。"], ["Freeze extra in an ice-cube tray; use within a month.", "多餘的可放製冰盒冷凍，一個月內食用。"]], "tip": "No salt, no sugar, no honey before 12 months. Offer one new food at a time and wait 2–3 days before the next, so a reaction is easy to spot. 一歲前不要加鹽、糖或蜜糖；每次只試一種新食物，隔2至3天再試下一款，方便觀察過敏反應。"}, {"id": "r44", "cat": "baby", "en": "Sweet Potato & Pumpkin Purée (from ~6 months)", "cn": "番薯南瓜蓉（約6個月起）", "img": "", "ytid": "", "time": "25 min", "serves": "3-4 baby portions", "ing": [["🍠", "Sweet potato 100g, peeled and cubed", "番薯 100克（去皮切粒）"], ["🎃", "Pumpkin 100g, peeled and cubed", "南瓜 100克（去皮切粒）"], ["💧", "Cooled boiled water as needed", "涼開水 適量"]], "steps": [["Steam both together 15–18 minutes until very soft.", "番薯與南瓜同蒸15至18分鐘至非常軟身。"], ["Mash well, loosening with water to a smooth purée.", "徹底壓爛，加水調至順滑。"], ["Serve lukewarm. Thicken slightly as baby gets used to spoons.", "微溫餵食。寶寶習慣後可調稠一點。"]], "tip": "Naturally sweet, gentle on the tummy, and rich in beta-carotene. 天然清甜易消化，含豐富胡蘿蔔素。"}, {"id": "r45", "cat": "baby", "en": "Smooth Rice Congee (Baby's 10-times Congee, from ~6 months)", "cn": "十倍粥（約6個月起）", "img": "", "ytid": "", "time": "50 min", "serves": "3-4 baby portions", "ing": [["🍚", "Rice 1 tbsp", "白米 1湯匙"], ["💧", "Water 10 tbsp (10 parts water to 1 rice)", "水 10湯匙（米水比例1:10）"]], "steps": [["Rinse the rice, then soak 30 minutes.", "白米洗淨，浸30分鐘。"], ["Simmer gently with the water 40–45 minutes, stirring now and then, until it is a soft, creamy porridge.", "加水細火煲40至45分鐘，間中攪拌，煮成軟滑稀粥。"], ["Blend or sieve for the first weeks; later just mash for a thicker texture.", "初期打滑或過篩；之後可壓爛保留稠身口感。"], ["Cool to lukewarm before feeding.", "放至微溫才餵。"]], "tip": "The classic Chinese first food. Move from 1:10 to 1:7 then 1:5 rice-to-water as baby grows. 中式最經典的第一口食物；隨月齡由十倍粥轉七倍、五倍粥。"}, {"id": "r46", "cat": "baby", "en": "Avocado & Banana Mash (from ~6 months, no cooking)", "cn": "牛油果香蕉蓉（約6個月起，免煮）", "img": "", "ytid": "", "time": "5 min", "serves": "1-2 baby portions", "ing": [["🥑", "Ripe avocado ¼", "熟牛油果 ¼個"], ["🍌", "Ripe banana ¼", "熟香蕉 ¼條"]], "steps": [["Mash both together with a fork until completely smooth.", "用叉將兩者壓至完全順滑。"], ["Serve straight away — avocado browns quickly.", "即時餵食，牛油果容易變色。"]], "tip": "Good fats for brain development, and no cooking when you are out. 含益腦好脂肪，外出時免煮方便。"}, {"id": "r47", "cat": "baby", "en": "Fish & Vegetable Congee (from ~7 months)", "cn": "魚肉蔬菜粥（約7個月起）", "img": "", "ytid": "", "time": "45 min", "serves": "3-4 baby portions", "ing": [["🍚", "Baby congee 1 bowl (see 10-times congee)", "嬰兒粥 1碗（見十倍粥）"], ["🐟", "Boneless white fish 30g (cod, garoupa, sole)", "無骨白身魚 30克（鱈魚、石斑、龍脷）"], ["🥬", "Spinach or choy sum leaves, a small handful", "菠菜或菜心葉 少許"], ["🫚", "Ginger 1 slice (removed before serving)", "薑 1片（餵前取出）"]], "steps": [["Steam the fish with the ginger 8 minutes. Check very carefully for bones — twice.", "魚加薑蒸8分鐘。仔細檢查兩次，確保無骨。"], ["Blanch the greens 2 minutes and chop very finely.", "青菜灼2分鐘，切至極幼。"], ["Flake the fish and stir it into the warm congee with the greens.", "魚肉拆碎，與青菜拌入溫粥中。"], ["Mash to the texture your baby handles; serve lukewarm.", "按寶寶接受的口感壓爛，微溫餵食。"]], "tip": "Fish is a common allergen — introduce it on a day you can watch baby for a few hours, and only alongside foods already tried. 魚是常見致敏食物，宜在能觀察數小時的日子引入，並配已試過的食材。"}, {"id": "r48", "cat": "baby", "en": "Chicken, Pumpkin & Potato Mash (from ~7 months)", "cn": "雞肉南瓜薯蓉（約 ewarm.", "拌入溫粥，微溫餵食。"]], "tip": "Soya is another common allergen — introduce it on its own first. 大豆亦屬常見致敏食物，宜單獨引入。"}, {"id": "r51", "cat": "baby", "en": "Soft Veggie Sticks to Hold (from ~9 months)", "cn": "手指蔬菜條（約9個月起）", "img": "", "ytid": "", "time": "20 min", "serves": "1-2 baby portions", "ing": [["🥕", "Carrot 1, cut into finger-length sticks", "紅蘿蔔 1條（切手指長條）"], ["🥦", "Broccoli, a few florets with stalks", "西蘭花 數朵（連莖）"], ["🍠", "Sweet potato, cut into sticks", "番薯（切條）"]], "steps": [["Steam everything 12–15 minutes until soft enough to squash between your finger and thumb.", "全部蒸12至15分鐘，軟至可用手指輕易壓扁。"], ["Cool until just warm and let baby pick them up.", "放至微溫，讓寶寶自己拿著吃。"], ["Stay beside baby for every bite.", "全程在旁陪伴。"]], "tip": "Sticks should be soft enough to squash easily — anything firm and round is a choking risk. Always supervise, and keep baby sitting upright. 蔬菜條必須一壓即扁；硬身或圓形食物有哽塞風險。必須全程看顧，並讓寶寶坐直進食。"}, {"id": "r52", "cat": "baby", "en": "Minced Pork, Egg & Veg Congee (from ~10 months)", "cn": "肉碎蔬菜粥（約10個月起）", "img": "", "ytid": "", "time": "50 min", "serves": "3-4 baby portions", "ing": [["🍚", "Rice 2 tbsp + water 10 tbsp (thicker 1:5 congee)", "白米 2湯匙、水 10湯匙（五倍稠粥）"], ["🐖", "Minced pork 40g", "免治豬肉 40克"], ["🥕", "Carrot 2 tbsp, finely diced", "紅蘿蔔粒 2湯匙"], ["🥬", "Greens, finely chopped, 2 tbsp", "青菜碎 2湯匙"], ["🥚", "Egg yolk 1 (optional, if already tried)", "蛋黃 1隻（如已試過可加）"]], "steps": [["Simmer the rice and water 40 minutes into a thick congee.", "米加水細火煲40分鐘成稠粥。"], ["Add the pork and carrot; cook 10 minutes, breaking up the meat.", "加入豬肉和紅蘿蔔煮10分鐘，將肉撥散。"], ["Stir in the greens, then the beaten yolk, and cook 2 more minutes.", "加入青菜，再拌入蛋液，煮2分鐘。"], ["Mash lightly — by now baby can manage small soft lumps. Serve lukewarm.", "略壓即可，此階段寶寶可應付細小軟粒。微溫餵食。"]], "tip": "Still no salt or sauces: a baby's kidneys can't handle them, and early salt sets up a taste for it later. 仍然不要加鹽或醬料：寶寶腎臟未能處理，過早吃鹹亦會養成重口味。"}, {"id": "r53", "cat": "baby", "en": "Mini Omelette Strips (from ~10 months)", "cn": "迷你蛋皮條（約10個月起）", "img": "", "ytid": "", "time": "10 min", "serves": "1-2 baby portions", "ing": [["🥚", "Egg 1, beaten", "雞蛋 1隻（打勻）"], ["🧀", "Grated cheese 1 tsp (optional, low-salt)", "芝士碎 1茶匙（可加，選低鹽）"], ["🫒", "A little oil for the pan", "少許油"]], "steps": [["Cook the beaten egg in a lightly oiled pan over low heat into a thin, fully-set omelette.", "蛋液用少油細火煎成薄身、完全熟透的蛋皮。"], ["Cool, then cut into finger-width strips baby can grip.", "放涼後切成手指闊度的長條，方便抓握。"]], "tip": "An easy way to serve iron and protein as finger food once egg has been introduced. 引入雞蛋後，這是方便的手指食物，補充鐵質及蛋白質。"}]);

/* ============ constants ============ */
/* Courses are the family's to change now, so they live in the shared data and
   only start from this list. COURSES is replaced by whatever the server sends. */
const DEFAULT_COURSES = [
  {key:'breakfast', en:'Breakfast', cn:'早餐'},
  {key:'lunch', en:'Lunch', cn:'午餐'},
  {key:'soup', en:'Soup', cn:'湯水'},
  {key:'appetizer', en:'Appetiser', cn:'前菜'},
  {key:'main', en:'Main', cn:'主菜'},
  {key:'dessert', en:'Sweet', cn:'糖水'},
  {key:'baby', en:'Baby Food', cn:'嬰兒食物'},
];
let COURSES = DEFAULT_COURSES.slice();
/* Course order used for both the filter sheet and the card grid. */
let ORDER = COURSES.map(c=>c.key);
let CATS = [{key:'all', en:'All dishes', cn:'全部'}].concat(COURSES);
function setCourses(list){
  const clean=(list||[]).filter(c=>c&&c.key).map(c=>({key:String(c.key),en:String(c.en||c.key),cn:String(c.cn||'')}));
  COURSES = clean.length ? clean : DEFAULT_COURSES.slice();
  ORDER = COURSES.map(c=>c.key);
  CATS = [{key:'all', en:'All dishes', cn:'全部'}].concat(COURSES);
}
function courseOf(key){ return COURSES.find(c=>c.key===key) || {key:key, en:key, cn:''}; }

/* Each sister keeps her own shelf. Everything that was already in the cookbook
   belongs to VT, so a dish with no shelf recorded is a VT dish. */
const BOOKS = [
  {key:'VT', en:'VT', cn:'VT'},
  {key:'MT', en:'MT', cn:'MT'},
  {key:'CT', en:'CT', cn:'CT'},
];
const DEFAULT_BOOK = 'VT';
const bookOf = r => (r && r.book) || DEFAULT_BOOK;
const SIZES = [
  {key:'s', name:'Small', base:14, sample:'.85em'},
  {key:'m', name:'Medium', base:16, sample:'1.05em'},
  {key:'l', name:'Large', base:18.5, sample:'1.35em'},
  {key:'xl', name:'Largest', base:21, sample:'1.7em'},
];
const KEY = 'tinsCookbook.prefs.v1';
const WHO_KEY = 'tinsCookbook.who.v1';
/* The app's own wording is written "English 中文". When the reader has turned
   Chinese off in Settings, zh() drops the Chinese half, so no button, label,
   heading or placeholder is left mixing the two scripts. Recipe text and the
   market card are separate — those carry their own rules. */
function zh(t){ return S.showCn ? t : ''; }
/* A family note is kept as one piece of text with the Chinese written after the
   English, so with Chinese turned off the tail is dropped rather than shown. */
function noCn(t){
  if(S.showCn) return t||'';
  return String(t||'')
    .replace(/[\u3000-\u303f\u4e00-\u9fff\uff00-\uffef]+[\s\u3000-\u303f\u4e00-\u9fff\uff00-\uffef]*/g, '')
    .replace(/\s{2,}/g,' ').trim();
}

function whoAmI(){ try{ return localStorage.getItem(WHO_KEY)||''; }catch(e){ return ''; } }

      else if(action==='note') r.saveNote(payload);
      else if(action==='unnote') r.deleteNote(payload);
      else reject(new Error('unknown action'));
      return;
    }
    if(!REMOTE){ reject(new Error('offline')); return; }
    fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:action, payload:payload})
    }).then(function(r){ return r.json(); })
      .then(function(j){ if(j && j.ok) resolve(j.data); else reject(new Error((j&&j.error)||'server error')); })
      .catch(reject);
  });
}

/* ============ the phone's own copy of the cookbook ============

   Recipes and photos are kept in IndexedDB on the phone. Opening the app draws
   that copy straight away — no waiting — and only then asks the server what has
   changed since. Photos are fetched one at a time as cards scroll into view and
   are never fetched twice, because a photo's name is a fingerprint of itself. */

const IDB = (function(){
  let open=null;
  function db(){
    if(open) return open;
    open = new Promise((res,rej)=>{
      if(!self.indexedDB){ rej(new Error('no indexeddb')); return; }
      const rq = indexedDB.open('tinsCookbook', 1);
      rq.onupgradeneeded = ()=>{
        const d = rq.result;
        if(!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
        if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');
      };
      rq.onsuccess = ()=>res(rq.result);
      rq.onerror = ()=>rej(rq.error);
    });
    return open;
  }
  function run(store, mode, fn){
    return db().then(d=>new Promise((res,rej)=>{
      const t = d.transaction(store, mode);
      const rq = fn(t.objectStore(store));
      t.oncomplete = ()=>res(rq ? rq.result : undefined);
      t.onerror = ()=>rej(t.error);
      t.onabort = ()=>rej(t.error);
    }));
  }
  return {
    get:(store,k)=>run(store,'readonly',s=>s.get(k)).catch(()=>null),
    put:(store,k,v)=>run(store,'readwrite',s=>s.put(v,k)).catch(()=>null),
  };
})();

const CACHE_KEY = 'cookbook.v6';
function cacheShared(){

    rev:S.rev, overrides:S.overrides, custom:S.customs,

  });
}
function loadCache(){
  return IDB.get('kv', CACHE_KEY).then(c=>{
    if(!c) return false;
    S.overrides = c.overrides || {};
    S.customs = c.custom || [];
    S.rev = c.rev || 0;
    if(c.courses) setCourses(c.courses);
    S.menus = c.menus || (c.menu && c.menu.date ? {[c.menu.date]: c.menu} : {});
    S.notes = c.notes || [];
    return true;
  }).catch(()=>false);
}

/* Applies whatever the server sent — the lot, or only what changed. */
function applyServer(d){
  if(!d) return false;
  if(d.courses) setCourses(d.courses);
  if(d.notes) S.notes = d.notes;
  if(d.menus) S.menus = d.menus;
  else if(d.menu && d.menu.date) S.menus = {[d.menu.date]: d.menu};
  if(d.unchanged){ S.rev = d.rev || S.rev; return false; }
  if(d.full){
    S.overrides = d.overrides || {};
    S.customs = d.custom || [];
  }else{
    Object.keys(d.overrides||{}).forEach(k=>{ S.overrides[k] = d.overrides[k]; });
    (d.custom||[]).forEach(c=>{
      const i = S.customs.findIndex(x=>x.id===c.id);
      if(i>=0) S.customs[i]=c; else S.customs.push(c);
    });
    (d.tombs||[]).forEach(t=>{ S.customs = S.customs.filter(x=>x.id!==t.id); });
  }
  S.rev = d.rev || 0;
  return true;
}

/* Redrawing the screen under someone's fingers is worse than showing them a
   slightly old list, so a background update never interrupts typing or cooking.
   The new dishes are still taken in — they simply appear on the next screen. */
function safeToRedraw(){
  if(S.view==='edit' || S.view==='cook' || S.draft || S.newCourse) return false;
  const a = document.activeElement;
  if(a && (a.tagName==='INPUT' || a.tagName==='TEXTAREA')) return false;
  return true;
}

let syncInFlight = null;
function loadShared(opts){
  opts = opts || {};
  if(!SHARED){ S.loaded=true; return Promise.resolve(false); }
  /* If a check is already on its way, wait for that one rather than shrugging:
     a pull that quietly did nothing would be worse than a slightly slow one. */
  if(syncInFlight) return syncInFlight;
  S.syncing = true;
  const first = !S.rev;
  if(first) showToast('☁ Loading the family cookbook…' + zh(' 載入中') + '…', true);
  syncInFlight = api('get', {since:S.rev}).then(d=>{
    if(first) hideToast();
    S.syncing=false; syncInFlight=null; S.loaded=true;
    const changed = applyServer(d);
    cacheShared();
    if(changed){ syncIdle = 0; } else { syncIdle = Math.min(syncIdle+1, 4); }
    if(first || opts.manual || (changed && safeToRedraw())) render();
    else if(changed) renderGridOnly();
    if(changed && !first) flash('Updated' + zh(' 已更新'));
    else if(opts.manual) flash('Everything is up to date' + zh(' 已是最新'));
    scheduleSync();
    return changed;
  }).catch(()=>{
    if(first) hideToast();
    S.syncing=false; syncInFlight=null; S.loaded=true;
    if(first || opts.manual) render();
    if(first && !S.customs.length && !Object.keys(S.overrides).length) flash("Couldn't reach the family cookbook" + zh(" 未能連接") + "");
    else if(opts.manual) flash('No connection — try again' + zh(' 未能連接'));
    syncIdle = Math.min(syncIdle+1, 4);
    scheduleSync();
    return false;
  });
  return syncInFlight;
}

/* ---- checking for other people's changes by itself ----

   A "nothing has changed" answer is a few hundred bytes, so the app can afford
   to ask often while the family is cooking together. It asks every 20 seconds
   at first, then eases off towards five minutes as the answers keep coming back
   empty, and snaps back to 20 seconds the moment something changes or somebody
   touches the screen. Nothing runs at all while the app is in the background. */
const SYNC_FAST = 45000, SYNC_SLOW = 600000;
let syncTimer = null, syncIdle = 0;

function syncWait(){ return Math.min(SYNC_SLOW, SYNC_FAST * Math.pow(2, syncIdle)); }
function scheduleSync(){
  clearTimeout(syncTimer);
  if(!SHARED) return;
  syncTimer = setTimeout(function(){
    if(document.visibilityState === 'visible') loadShared();
    else scheduleSync();
  }, syncWait());
}
/* Someone is using the app right now — look for their family's changes sooner. */
function syncSoon(){
  if(!SHARED) return;
  if(syncIdle === 0 && syncTimer) return;
  syncIdle = 0;
  scheduleSync();
}

/* ---- photos ---- */
const BLANK_PX = 'data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
const PMEM = Object.create(null);     // fingerprint -> data URL, this session
const PASKED = Object.create(null);   // fingerprint -> already being fetched
/* Photos are fetched down several lanes at once: one request at a time meant
   waiting the round trip to Google for every handful, which is most of the
   wait. Small batches down four lanes means the first pictures appear quickly
   and the rest stream in behind them. Once the visible ones are in hand the
   app quietly collects the remainder, so scrolling on is instant and a second
   visit needs no network at all. */
const PHOTO_LANES = 4, PHOTO_BATCH = 3;
let photoQueue = [], photoLanes = 0, photoWatcher = null, photoSweepT = null;
let photoIdleT = null, photoPrefetched = false;

const phRef  = v => (typeof v==='string' && v.slice(0,3)==='ph:') ? v.slice(3) : '';
/* What to show right now: a stored photo, an ordinary URL, or nothing yet. */
function photoSrc(v){ const h=phRef(v); return h ? (PMEM[h]||'') : (v||''); }

function wantPhoto(h, atBack){
  if(!h || PMEM[h] || PASKED[h]) return;
  PASKED[h] = true;
  if(atBack) photoQueue.push(h); else photoQueue.unshift(h);
  drainPhotos();
}
function drainPhotos(){
  while(photoLanes < PHOTO_LANES && photoQueue.length) runLane();
}
function runLane(){
  const batch = photoQueue.splice(0, PHOTO_BATCH);
  if(!batch.length) return;
  photoLanes++;
  Promise.all(batch.map(h=>IDB.get('photos', h).then(v=>({h:h, v:v}))))
    .then(found=>{
      const missing = [];
      found.forEach(f=>{ if(f.v) PMEM[f.h]=f.v; else missing.push(f.h); });
      if(found.some(f=>f.v)) paintPhotos();
      if(!missing.length || !SHARED) return null;
      return api('photos', missing).then(map=>{
        Object.keys(map||{}).forEach(h=>{
          if(!map[h]) return;
          PMEM[h] = map[h];
          IDB.put('photos', h, map[h]);
        });
        paintPhotos();
      });
    })
    .catch(()=>{})
    .then(()=>{
      photoLanes--;
      if(photoQueue.length) drainPhotos();
      else if(!photoLanes) schedulePrefetch();
    });
}
/* Once what is on screen has arrived, fetch the rest in the background so the
   cookbook is fully stocked on this phone and never waits again. */
function schedulePrefetch(){
  if(photoPrefetched || !SHARED) return;
  clearTimeout(photoIdleT);
  photoIdleT = setTimeout(function(){
    photoPrefetched = true;
    const seen = Object.create(null);
    merged().forEach(r=>{
      const h = phRef(r.img);
      if(h) seen[h] = 1;
      (r.steps||[]).forEach(st=>{ const g = phRef(st && st[2]); if(g) seen[g] = 1; });
    });
    Object.keys(seen).forEach(h=>wantPhoto(h, true));
  }, 1200);
}
/* Drops arrived photos into the page without redrawing anything else. */
function paintPhotos(){
  document.querySelectorAll('[data-ph]').forEach(el=>{
    const h = el.getAttribute('data-ph');
    if(!PMEM[h]) return;
    if(el.tagName==='IMG') el.src = PMEM[h];
    else el.style.backgroundImage = "url('" + PMEM[h] + "')";
    el.removeAttribute('data-ph');
  });
}
/* Only asks for a photo once its card is actually about to be seen. */
function nearView(el){
  const r = el.getBoundingClientRect();
  if(!r.width && !r.height) return false;
  return r.bottom > -500 && r.top < (window.innerHeight + 500);
}
/* Belt and braces: the observer below does the work on a phone, but a browser
   that has paused the tab never runs it, and a photo that never loads is worse
   than one loaded slightly early. So a sweep also picks up anything on screen. */
function sweepPhotos(){
  /* Nearest the top of the screen first: those are the ones being looked at. */
  const want = [];
  document.querySelectorAll('[data-ph]').forEach(el=>{
    if(!nearView(el)) return;
    want.push({h: el.getAttribute('data-ph'), y: Math.abs(el.getBoundingClientRect().top)});
  });
  want.sort((a,b)=>a.y-b.y).slice(0, 30).reverse().forEach(x=>wantPhoto(x.h));
}
function watchPhotos(){
  const pending = document.querySelectorAll('[data-ph]');
  if(!pending.length) return;
  if('IntersectionObserver' in window){
    if(!photoWatcher){
      photoWatcher = new IntersectionObserver(entries=>{
        entries.forEach(en=>{
          if(!en.isIntersecting) return;
          photoWatcher.unobserve(en.target);
          wantPhoto(en.target.getAttribute('data-ph'));
        });
      }, {rootMargin:'400px'});
    }
    pending.forEach(el=>photoWatcher.observe(el));
  }
  clearTimeout(photoSweepT);
  photoSweepT = setTimeout(sweepPhotos, 400);
}
/* Scrolling happens inside the page, so listen on the way down. */
document.addEventListener('scroll', function(){
  clearTimeout(photoSweepT);
  photoSweepT = setTimeout(sweepPhotos, 120);
}, true);
async function tzhClient(t){
  if(!t) return '';
  try{
    const ac=new AbortController(); setTimeout(()=>ac.abort(),4000);
    const r=await fetch('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q='+encodeURIComponent(t),{signal:ac.signal});
    const j=await r.json(); return (j[0]||[]).map(x=>x[0]).join('').trim();
  }catch(e){ return ''; }
}
async function clientTranslate(o){
  if(o.en && !o.cn) o.cn = await tzhClient(o.en);
  for(const i of o.ing){ if(i[1] && !i[2]) i[2]=await tzhClient(i[1]); }
  for(const s of o.steps){ if(s[0] && !s[1]) s[1]=await tzhClient(s[0]); }
  if(o.tip && !/[一-鿿]/.test(o.tip)){ const z=await tzhClient(o.tip); if(z) o.tip=o.tip+' '+z; }
  return o;
}

/* ============ merge & lookup ============ */
const isGone = o => o==='deleted' || (o && o.del===true);
function merged(){
  const list = BASE
    .filter(r=>!isGone(S.overrides[r.id]))
    .map(r=> (S.overrides[r.id] && !isGone(S.overrides[r.id])) ? Object.assign({}, r, S.overrides[r.id]) : r)
    .concat(S.customs);
  /* Keep the grid tidy: dishes always sit in course order, so a dish added
     today lands with the other breakfasts instead of at the very bottom. */
  const rank = r => { const i = ORDER.indexOf(r.cat); return i<0 ? ORDER.length : i; };
  return list.map((r,i)=>({r:r,i:i}))
             .sort((a,b)=>{ const d = rank(a.r)-rank(b.r); return d!==0 ? d : a.i-b.i; })
             .map(x=>x.r);
}
function cur(){ return merged().find(r=>r.id===S.recipeId)||null; }
function matches(r,q){
  if(!q) return true;
  const hay=[r.en,r.cn].concat((r.ing||[]).map(i=>i[1]+' '+i[2])).join(' ').toLowerCase();
  return hay.indexOf(q)>=0;
}
function filtered(){
  const q=S.query.trim().toLowerCase();
  const fav = S.cat==='fav';
  return merged().filter(r=>{
    /* Favourites reach across all three shelves — otherwise a dish you saved
       would vanish the moment you looked at another sister's tab. */
    if(fav){ if(!S.favs.includes(r.id)) return false; }
    else{
      if(bookOf(r)!==S.book) return false;
      if(S.cat!=='all' && r.cat!==S.cat) return false;
    }
    return matches(r,q);
  });
}

/* ---- the menu for a day ----
   Meals are planned per day, so the kitchen can be told about tomorrow, or
   about a birthday next week, without disturbing what is being cooked today. */
function dayKey(offset){
  const d = new Date();
  d.setDate(d.getDate() + (offset||0));
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function dayLabel(key, long){
  const today = dayKey(0), tomorrow = dayKey(1);
  if(key === today) return long ? 'Today' + zh(' 今日') : 'Today';
  if(key === tomorrow) return long ? 'Tomorrow' + zh(' 聽日') : 'Tomorrow';
  const p = String(key).split('-');
  const d = new Date(+p[0], +p[1]-1, +p[2]);
  return d.toLocaleDateString('en-GB', long ? {weekday:'long', day:'numeric', month:'long'} : {weekday:'short', day:'numeric'});
}
/* VT, MT and CT do not share a kitchen, so each keeps its own plan for a day.
   A menu is filed under "SHELF|YYYY-MM-DD". Dishes may be picked from any
   shelf — only the plan itself belongs to one. */
function menuKey(book, date){ return (book||S.menuBook||S.book) + '|' + (date||S.menuDate||dayKey(0)); }
function menuFor(book, date){ return S.menus[menuKey(book, date)] || null; }
function menuIds(book, date){ const m = menuFor(book, date); return m ? (m.items||[]).slice() : []; }
function onMenu(id, book, date){ return menuIds(book, date).indexOf(id) >= 0; }
/* Laid out in course order so the helper can read it straight down. */
function menuItems(book, date){
  const ids = menuIds(book, date);
  if(!ids.length) return [];
  const all = merged();
  const rank = r => { const i = ORDER.indexOf(r.cat); return i<0 ? ORDER.length : i; };
  return ids.map(id=>all.find(r=>r.id===id)).filter(Boolean)
            .map((r,i)=>({r:r,i:i}))
            .sort((a,b)=>{ const d = rank(a.r)-rank(b.r); return d!==0 ? d : a.i-b.i; })
            .map(x=>x.r);
}
/* ============ planning a dish from the dish itself ============

   This used to be one button that said "add to today's meal". It read today's
   menu but wrote to whichever day the planner had last been left on, so tapping
   it usually appeared to do nothing at all. The days are on screen now: each
   one says whether this dish is already on it, and tapping toggles that day.
   Nothing is hidden, and there is no way for the label and the effect to

  const planned = [];
  for(let i = 0; i < PLAN_DAYS; i++){ const k = dayKey(i); if(onMenu(r.id, b, k)) planned.push(dayLabel(k)); }

/* Days this shelf has something planned for, today first. */
function plannedDays(book){
  const b = book || S.book;
  return Object.keys(S.menus)
    .filter(k=>k.indexOf(b+'|')===0 && k.split('|')[1] >= dayKey(0) && (S.menus[k].items||[]).length)
    .map(k=>k.split('|')[1]).sort();
}

/* ============ the whiteboard ============

   The things that are not a recipe: who is off salt this week, which burner
   trips the switch, that the helper is away on Thursday. They sit above the
   dishes on the front page so nobody has to be told twice, and pinning one is
   what keeps it there. */
function noteWhen(n){
  const t = n.editedAt || n.at;
  if(!t) return '';
  const d = new Date(t);
  if(isNaN(d)) return '';
  const day = d.toISOString().slice(0,10);
  const mins = Math.round((Date.now() - d.getTime()) / 60000);
  if(mins < 2) return 'just now';
  if(mins < 60) return mins + ' min ago';
  if(day === dayKey(0)) return d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(day === dayKey(-1)) return 'yesterday';
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
/* VT, MT and CT do not share a kitchen, so they do not share a board either.
   A note written before shelves reached the board counts as VT's. */

function shelfNotes(book){ const b = book || S.book; return S.notes.filter(n=>noteBook(n)===b); }
/* Only one note at a time is kept on the Cook page — a board where everything
