/* ============ planning the meals ============
   Whoever plans taps dishes here, for today or for any day ahead. The plan is
   saved with everyone else's cookbook data, so it appears on the helper's phone
   by itself, and Send hands the same list to WhatsApp for those who prefer it. */

function menuHtml(){
  const book = S.menuBook || S.book;
  const key = S.menuDate || dayKey(0);
  const m = menuFor(book, key);
  const chosen = menuItems(book, key);
  const q = S.menuPick.trim().toLowerCase();
  /* Dishes come from every shelf — only the plan belongs to one. The two rows
     of chips below just narrow what is on offer while you are choosing. */
  const openList = merged().filter(r=>!onMenu(r.id, book, key) && matches(r,q));
  const pool = openList.filter(r=>
    (!S.pickBook || bookOf(r)===S.pickBook) &&
    (!S.pickCat  || r.cat===S.pickCat));

  const chip = (act, val, label, count, on) =>
    `<span data-act="${act}:${val}" class="daychip" style="background:${on?'#F7C948':'#FFFBEE'};border-color:${on?'#F7C948':'#EADFC2'};color:${on?'#4A4A46':'#7A6A52'};font-weight:${on?700:600}">${esc(label)}${count===null?'':`<span style="opacity:.6;margin-left:.3em">${count}</span>`}</span>`;

  const shelfFilter = [chip('pickPoolBook','', 'All shelves', openList.length, !S.pickBook)]
    .concat(BOOKS.map(b=>chip('pickPoolBook', b.key, b.en,
      openList.filter(r=>bookOf(r)===b.key).length, S.pickBook===b.key))).join('');

  const inShelf = openList.filter(r=>!S.pickBook || bookOf(r)===S.pickBook);
  const courseFilter = [chip('pickPoolCat','', 'All courses', inShelf.length, !S.pickCat)]
    .concat(COURSES.map(c=>{
      const n = inShelf.filter(r=>r.cat===c.key).length;
      return n ? chip('pickPoolCat', c.key, c.en, n, S.pickCat===c.key) : '';
    })).join('');

  const bookChips = BOOKS.map(b=>{
    const on = b.key===book;
    const n = plannedDays(b.key).length;
    return `<span data-act="pickMenuBook:${b.key}" class="booktab" style="background:${on?'#F7C948':'#FFFBEE'};border-color:${on?'#F7C948':'#EADFC2'};color:${on?'#4A4A46':'#87806F'};font-weight:${on?700:600}">${esc(b.en)}${n?`<span style="opacity:.6;font-size:.85em;margin-left:.3em">${n}</span>`:''}</span>`;
  }).join('');

  /* A week of days to plan into, plus any date already planned further out. */
  const days = [];
  for(let i=0;i<8;i++) days.push(dayKey(i));
  plannedDays(book).forEach(k=>{ if(days.indexOf(k)<0) days.push(k); });
  days.sort();
  const dayChips = days.map(k=>{
    const on = k===key;
    const n = ((S.menus[menuKey(book,k)]||{items:[]}).items||[]).length;
    return `<span data-act="pickMenuDay:${k}" class="daychip" style="background:${on?'#F7C948':'#FFFBEE'};border-color:${on?'#F7C948':'#EADFC2'};color:${on?'#4A4A46':'#7A6A52'};font-weight:${on?700:600}">${esc(dayLabel(k))}${n?`<span style="opacity:.65;margin-left:.3em">${n}</span>`:''}</span>`;
  }).join('');

  const chosenRows = chosen.map((r,i)=>`
    <div data-act="preview:${r.id}" style="display:flex;align-items:center;gap:.7em;background:#FFFBEE;border:1px solid #EADFC2;border-radius:.75em;padding:.7em .85em;cursor:pointer">
      <div style="flex:1;min-width:0">
        <div class="ins" style="font-size:.62em;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#8A5A33;line-height:1.3;margin-bottom:.15em">${esc(courseOf(r.cat).en)}</div>
        <div style="font-size:1em;line-height:1.25">${esc(r.en)}</div>
        ${S.showCn&&r.cn?`<div class="tc" style="font-size:.87em;color:#7A6A52">${esc(r.cn)}</div>`:''}
        <div class="ins" style="font-size:.72em;color:#87806F;margin-top:.2em">${esc(bookOf(r))}${r.time?' · '+esc(r.time):''}</div>
      </div>
      <span data-act="menuOff:${r.id}" style="color:#B0A28C;font-size:1.15em;padding:0 .3em;cursor:pointer">×</span>
    </div>`).join('');

  const poolRow = r=>`
    <div data-act="menuOn:${r.id}" style="display:flex;align-items:center;gap:.7em;padding:.6em .2em;border-bottom:1px solid #EADFC2;cursor:pointer">
      <div${phMark(r.img)} style="width:2.6em;height:2.6em;border-radius:.5em;flex:none;background-color:#F0E6CF;${bgStyle(r.img)};background-size:cover;background-position:center"></div>
      <div style="flex:1;min-width:0">
        <div style="font-size:.98em;line-height:1.2">${esc(r.en)}</div>
        ${S.showCn&&r.cn?`<div class="tc" style="font-size:.85em;color:#7A6A52">${esc(r.cn)}</div>`:''}
        <div class="ins" style="font-size:.72em;color:#87806F">${esc(bookOf(r))}${r.time?' · '+esc(r.time):''}</div>
      </div>
      <span class="ins" style="color:#8A5A33;font-weight:700;font-size:1.05em">+</span>
    </div>`;
  /* Every dish in the cookbook is here, in course order, the same way the Cook
     tab is laid out, so a whole meal can be built straight down the list. */
  const known = COURSES.map(c=>c.key);
  const groups = COURSES
    .map(c=>({course:c, items:pool.filter(r=>r.cat===c.key)}))
    .concat([{course:{key:'_rest', en:'Everything else', cn:'其他'},
              items:pool.filter(r=>known.indexOf(r.cat)<0)}])
    .filter(g=>g.items.length);
  const poolRows = groups.map(g=>`
    <div class="rule" style="margin:1.1em 0 .1em">
      <span class="eyebrow" style="font-size:.64em">${esc(g.course.en)}${S.showCn&&g.course.cn?` <span class="tc" style="opacity:.7">${esc(g.course.cn)}</span>`:''}</span>
      <span class="line"></span>
      <span class="eyebrow" style="font-size:.64em;opacity:.55">${g.items.length}</span>
    </div>
    ${g.items.map(poolRow).join('')}`).join('');

  return `
  <div style="flex:1;display:flex;flex-direction:column;min-height:0">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:.75em;padding:1em 1.25em .8em;border-bottom:1px solid #EADFC2;flex:none">
      <span data-act="goHome" class="ins" style="font-size:.92em;font-weight:600;color:#87806F;cursor:pointer;padding:.3em .2em">‹ Back</span>
      <span style="font-size:1.05em">${esc(book)} · ${esc(dayLabel(key))}</span>
      <span data-act="shareMenu" class="ins" style="font-size:.92em;font-weight:700;color:${chosen.length?'#8A5A33':'#C4B99E'};cursor:pointer;padding:.3em .2em">Send</span>
    </div>
    <div class="pane" style="flex:1;overflow-y:auto;padding:1em 1.25em 2.5em">
      <div class="eyebrow" style="margin-bottom:.5em">Whose kitchen${zh(' 邊個廚房')}</div>
      <div class="ins" style="display:flex;gap:.5em;margin-bottom:.9em">${bookChips}</div>
      <div class="eyebrow" style="margin-bottom:.5em">Which day${zh(' 邊一日')}</div>
      <div class="ins" style="display:flex;gap:.4em;overflow-x:auto;padding-bottom:.3em;-webkit-overflow-scrolling:touch">${dayChips}</div>
      <label class="ins" style="display:flex;align-items:center;gap:.5em;margin-top:.5em;font-size:.8em;color:#8A5A33;cursor:pointer">
        <span style="border:1px dashed #DCCFAF;border-radius:.5em;padding:.4em .7em">📅 Another date${zh(' 其他日子')}</span>
        <input type="date" data-in="menudate" value="${esc(key)}" min="${esc(dayKey(0))}" style="border:none;background:transparent;color:#8A5A33;font-size:.85em;outline:none">
      </label>

      <div style="margin-top:1em;font-size:.92em;color:#7A6A52;line-height:1.5">Pick what <b>${esc(book)}</b>'s kitchen should cook on <b>${esc(dayLabel(key, true))}</b>. Dishes can come from any shelf. Everyone sees it straight away.${zh(' 全家即時睇到。')}</div>

      ${chosen.length?`<div style="display:flex;flex-direction:column;gap:.5em;margin-top:1em">${chosenRows}</div>`:`<div style="margin-top:1em;text-align:center;border:1px dashed #DCCFAF;border-radius:.8em;padding:1.4em 1em;color:#87806F;font-size:.95em">Nothing chosen for this day yet — tap a dish below.</div>`}
      ${chosen.length?`
      <input data-in="menuoccasion" value="${esc((m&&m.occasion)||'')}" placeholder="Special occasion? e.g. Grandma's birthday${zh(' 特別日子')}" class="finput" style="margin-top:.7em;font-size:.95em">
      <textarea data-in="menunote" rows="2" placeholder="A note for the kitchen${zh(' 給廚房嘅備註')}" class="f2" style="margin-top:.5em">${esc((m&&m.note)||'')}</textarea>
      <div class="ins" style="display:flex;gap:.5em;margin-top:.7em">
        <div data-act="shareMenu" class="ybtn" style="flex:1;border-radius:.8em;padding:.9em;text-align:center;font-size:.95em;font-weight:700">Send to helper${zh(' 發給姐姐')}</div>
        <div data-act="menuToList:${key}" style="flex:none;padding:.9em 1em;border:1.5px solid #EADFC2;border-radius:.8em;font-size:.9em;font-weight:700;color:#6B7A45;cursor:pointer">+ Shopping</div>
      </div>
      <div data-act="menuClear" class="ins" style="margin-top:.6em;text-align:center;font-size:.85em;font-weight:600;color:#A0947E;cursor:pointer;padding:.6em">Clear this day's menu</div>`:''}

      <div class="rule" style="margin:1.6em 0 .5em"><span class="eyebrow">Add a dish</span><span class="line"></span></div>
      <input data-in="menupick" value="${esc(S.menuPick)}" placeholder="Search every dish${zh(' 搜尋')}" class="finput">
      <div class="ins" style="display:flex;gap:.4em;overflow-x:auto;margin-top:.55em;padding-bottom:.25em;-webkit-overflow-scrolling:touch">${shelfFilter}</div>
      <div class="ins" style="display:flex;gap:.4em;overflow-x:auto;margin-top:.35em;padding-bottom:.25em;-webkit-overflow-scrolling:touch">${courseFilter}</div>
      <div class="ins" style="font-size:.75em;color:#87806F;margin-top:.55em">${pool.length} ${pool.length===1?'dish':'dishes'} to choose from${(S.pickBook||S.pickCat)?` · <span data-act="clearPoolFilters" style="color:#8A5A33;font-weight:700;cursor:pointer">show all</span>`:zh(' 全部菜式')}</div>
      <div>${poolRows}</div>
      ${pool.length===0?`<div style="text-align:center;padding:1.5em;color:#87806F;font-size:.95em">Nothing matches those filters.</div>`:''}
    </div>
  </div>`;
}

function setMenu(book, date, ids, extra){
  extra = extra || {};
  const was = menuFor(book, date) || {};
  const m = {
    date: date,
    book: book,
    items: ids,
    note: extra.note !== undefined ? extra.note : (was.note || ''),
    occasion: extra.occasion !== undefined ? extra.occasion : (was.occasion || ''),
    by: whoAmI() || was.by || ''
  };
  const k = menuKey(book, date);
  if(ids.length) S.menus[k] = Object.assign({}, was, m);
  else delete S.menus[k];
  cacheShared();
  if(SHARED) api('menu', m)
    .then(res=>{ if(res && res.menus) S.menus = res.menus; cacheShared(); })
    .catch(()=>flash("Couldn't share the menu — try again" + zh(" 未能同步") + ""));
}

/* A note goes up on this phone straight away and is sent on behind it, the same
   way a menu is. The server owns the list, so whatever it sends back wins. */
function applyNotes(res){
  if(res && res.notes) S.notes = res.notes;
  if(res && res.rev) S.rev = Math.max(S.rev, res.rev);
  cacheShared();
  render();
}
/* A new note is named here rather than by the server. It used to be given a
   throwaway id until the server answered, and starring it in that gap sent the
   throwaway id back — which the server did not recognise, so it wrote a second
   note. The same text then sat on the board twice, once starred and once not.
   Naming it up front means every request about a note carries the same id from
   the first one onwards, whatever order they arrive in. */
const newNoteId = () => 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);

function pushNote(n, done){
  const at = new Date().toISOString();
  const i = S.notes.findIndex(x=>x.id===n.id);
  if(i >= 0) S.notes[i] = Object.assign({}, S.notes[i], {text:n.text, pinned:n.pinned, img:n.img, editedBy:n.by, editedAt:at});
  else S.notes.unshift({id:n.id, text:n.text, by:n.by, at:at, pinned:n.pinned, img:n.img, book:n.book});
  /* One pinned note per shelf: pinning this one lets go of the last. */
  if(n.pinned) S.notes.forEach(x=>{ if(x.id!==n.id && noteBook(x)===n.book) x.pinned=false; });
  cacheShared();
  render();
  if(!SHARED){ flash(done); return; }
  api('note', n)
    .then(res=>{ applyNotes(res); flash(done); })
    .catch(()=>flash("Couldn't share that note — try again" + zh(' 未能同步')));
}

/* The message the helper actually receives. */
function menuText(book, key){
  const m = menuFor(book, key);
  const items = menuItems(book, key);
  const p = String(key).split('-');
  const when = new Date(+p[0], +p[1]-1, +p[2])
    .toLocaleDateString('en-GB', {weekday:'short', day:'numeric', month:'short'});
  const head = dayLabel(key) === 'Today' ? when : (dayLabel(key) + ' · ' + when);

  const lines = [];
  let last = '';
  items.forEach((r,i)=>{
    const c = courseOf(r.cat);
    if(c.en !== last){ last = c.en; lines.push('', (c.en + (c.cn ? ' ' + c.cn : '')).toUpperCase()); }
    const extra = [r.time, r.serves ? ('serves ' + r.serves) : ''].filter(Boolean).join(' · ');
    lines.push('· ' + r.en + (r.cn ? ' ' + r.cn : '') + (extra ? '  (' + extra + ')' : ''));
  });

  return "Tin's Family Cookbook — " + book + " menu" + zh(" 餐單") + "\n" + head +
         ((m && m.occasion) ? '\n' + m.occasion : '') + '\n' +
         lines.join('\n') + '\n' +
         ((m && m.note) ? '\n' + m.note + '\n' : '') +
         (APP_LINK ? '\nFull recipes' + zh(' 完整食譜') + ': ' + APP_LINK : '');
}
function shareMenu(book, key){
  book = book || S.menuBook || S.book;
  key = key || S.menuDate || dayKey(0);
  if(!menuItems(book, key).length){ flash('Choose a dish first' + zh(' 請先揀菜')); return; }
  const text = menuText(book, key);
  if(navigator.share){ navigator.share({title:'Menu' + zh(' 餐單'), text:text}).catch(()=>{}); return; }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text)
      .then(()=>flash('Menu copied — paste it to the helper' + zh(' 已複製')))
      .catch(()=>openWhatsApp(text));
    return;
  }
  openWhatsApp(text);
}
function openWhatsApp(text){
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
}

/* ============ pull down to update ============
   Two people cooking from the same cookbook want to see each other's changes.
   The app checks by itself (above), but a deliberate tug is quicker to trust,
   so dragging the list down past its top asks the server there and then. */
const PULL_TRIGGER = 68, PULL_MAX = 110;
let pull = { on:false, y0:0, dist:0 };

function scrollerFor(node){
  let el = node;
  while(el && el.nodeType === 1 && el.id !== 'app'){
    if(el.scrollHeight > el.clientHeight + 4){
      const oy = getComputedStyle(el).overflowY;
      if(oy === 'auto' || oy === 'scroll') return el;
    }
    el = el.parentElement;
  }
  return null;
}
function pullPaint(dist, state){
  const box = document.getElementById('ptrbox');
  if(!box) return;
  if(!dist && state !== 'busy'){ box.innerHTML = ''; return; }
  const shown = Math.min(dist, PULL_MAX);
  const label = state === 'busy' ? 'Updating…' + zh(' 更新中')
              : state === 'go'   ? 'Let go to update' + zh(' 放手更新')
                                 : 'Pull down to update' + zh(' 下拉更新');
  box.innerHTML = '<div class="ptrpill" style="transform:translate(-50%,' + Math.round(shown * 0.55 + 8) +
                  'px);opacity:' + Math.min(1, shown / 45).toFixed(2) + '">' + label + '</div>';
}
function pullAllowed(){
  return SHARED && !S.saving && S.view !== 'cook' && S.view !== 'edit' && !S.newCourse && !S.askWho;
}
function pullStart(e){
  pull.on = false;
  if(!pullAllowed() || !e.touches || e.touches.length !== 1) return;
  const sc = scrollerFor(e.target);
  if(sc && sc.scrollTop > 0) return;
  pull.on = true; pull.y0 = e.touches[0].clientY; pull.dist = 0;
}
function pullMove(e){
  if(!pull.on) return;
  const d = e.touches[0].clientY - pull.y0;
  if(d <= 0){ if(pull.dist){ pull.dist = 0; pullPaint(0); } return; }
  /* Resist a little, so it feels like paper rather than elastic. */
  pull.dist = d < PULL_MAX ? d : PULL_MAX + (d - PULL_MAX) * 0.25;
  if(e.cancelable) e.preventDefault();
  pullPaint(pull.dist, pull.dist >= PULL_TRIGGER ? 'go' : 'pull');
}
function pullEnd(){
  if(!pull.on) return;
  const go = pull.dist >= PULL_TRIGGER;
  pull.on = false; pull.dist = 0;
  if(!go){ pullPaint(0); return; }
  pullPaint(PULL_TRIGGER, 'busy');
  loadShared({manual:true}).then(function(){ pullPaint(0); });
}

   the single most useful thing it can do is put the list of dishes and the open

   method, so nobody scrolls up and down between what they need and what they
   are doing. The five buttons stand up in a rail on the left, where a pointer

  if(S.view==='edit' && S.draft) return editHtml();

/* ============ staying where you were ============

   Every redraw rebuilds the page, which would otherwise throw the reader back
   to the top — in the middle of scanning the dishes, or just after tapping a
   dish onto tomorrow's menu. So before the rebuild we note how far each
   scrolling column had been scrolled, and afterwards we put it back.

   Each column is labelled with what it is showing rather than where it sits, so
   the browse list keeps its place while a different dish opens beside it, and a
   newly opened dish still starts at the top where it should. */
function markPanes(){
  document.querySelectorAll('#app .pane').forEach((el,i)=>{
    el.dataset.sk = el.closest('#browsecol') ? 'browse'
                  : el.closest('#recipecol') ? 'recipe:'+(S.recipeId||'')
                  : S.view+':'+i;
  });
}
function panePlaces(){
  const at = {};
  document.querySelectorAll('#app .pane[data-sk]').forEach(el=>{
    if(el.scrollTop) at[el.dataset.sk] = el.scrollTop;
  });
  return at;
}
function restorePanes(at){
  const keys = Object.keys(at);
  if(!keys.length) return;
  document.querySelectorAll('#app .pane[data-sk]').forEach(el=>{
    const y = at[el.dataset.sk];
    if(y) el.scrollTop = y;
  });
}

function render(){
  const app=document.getElementById('app');
  const at=panePlaces();
  const size=SIZES.find(z=>z.key===S.size)||SIZES[1];
  app.style.fontSize=size.base+'px';
  const r=cur();
  const wide=WIDE();
  /* Browsing means the list and the open dish sit side by side. Everything
     else — the shopping list, settings, the planner, adding a dish — takes the
     whole space to the right of the rail. */
  const browsing = wide && (S.view==='home' || S.view==='recipe' || S.view==='cook');
  let shell;
  if(wide){
    shell = railHtml() + (browsing
      ? browseHtml() + (r ? recipePaneHtml(r) : emptyPaneHtml())
      : `<div id="mainpane">${viewHtml()}</div>`);
  } else {
    const showTabs=['home','list','settings'].includes(S.view);
    shell = `<div id="mainpane"${S.view==='home'?' class="roomy"':''}>${viewHtml()}</div>`
          + (showTabs?tabsHtml():'');
  }
  app.innerHTML = shell
    + (S.sheet && !wide ? sheetHtml():'')
    + (S.view==='cook'&&r ? (wide?cookWideHtml(r):cookHtml(r)) :'')
    + (S.market?marketHtml():'')
    + (S.favPick?favPickHtml():'')
    + (S.zoom?zoomHtml():'')
    + (S.askWho?whoHtml():'')
    + (S.newCourse?courseModalHtml():'')
    + `<div id="ptrbox"></div>`
    + `<div id="toastbox"></div>`;
  markPanes();
  restorePanes(at);
  renderToast();
  paintPhotos();
  watchPhotos();
}

/* Dragging a window across the 1024px line rebuilds the page in the other shape. */

/* At a desk the arrow keys step through a recipe, so nobody has to reach for
   the trackpad with wet hands. Escape leaves cook mode. */
document.addEventListener('keydown', e=>{
  if(S.view!=='cook') return;
  const t=e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA')) return;
  if(e.key==='ArrowRight' || e.key===' '){ e.preventDefault(); ACT.nextStep(); }
  else if(e.key==='ArrowLeft'){ e.preventDefault(); ACT.prevStep(); }
  else if(e.key==='Escape'){ e.preventDefault(); ACT.endCook(); }
});

function bylineFor(r){
  const bits=[];
  if(r.addedBy) bits.push('Added by '+esc(r.addedBy));
  if(r.editedBy && r.editedBy!==r.addedBy) bits.push('edited by '+esc(r.editedBy)+(r.editedAt?' · '+esc(r.editedAt):''));
  else if(r.editedBy && r.editedAt) bits.push('edited '+esc(r.editedAt));
  return bits.length? `<div class="byline">${bits.join(' · ')}</div>` : '';
}

/* ============ courses the family adds ============ */
function saveCourse(){
  if(S.saving) return;
  const en=(document.getElementById('courseEn')||{}).value||'';
  const cn=(document.getElementById('courseCn')||{}).value||'';
  const name=en.trim()||cn.trim();
  if(!name){ flash('Give the course a name' + zh(' 請輸入名稱')); return; }
  let key=name.toLowerCase().replace(/[^a-z0-9]/g,'');
  if(!key) key='course'+(COURSES.length+1);
  if(COURSES.some(c=>c.key===key)){ flash('That course already exists' + zh(' 已經有呢個分類')); S.newCourse=null; render(); return; }
  const next=COURSES.concat([{key:key, en:en.trim()||cn.trim(), cn:cn.trim()}]);
  if(!SHARED){ setCourses(next); S.newCourse=null; render(); flash('Course added'); return; }
  S.saving=true; render();
  api('courses', next).then(list=>{
    S.saving=false; setCourses(list); S.newCourse=null;
    if(S.draft) S.draft.cat=key;
    cacheShared(); render(); flash('Course added for everyone' + zh(' 已為全家加入'));
  }).catch(()=>{ S.saving=false; render(); flash("Couldn't add the course — check the connection"); });
}

function cleanDraft(){
  const d=S.draft;
  const ytid=ytId(d.ytid)||d.ytid.trim();
  return {
    en:d.en.trim()||d.cn.trim(), cn:d.cn.trim(), cat:d.cat, book:d.book||DEFAULT_BOOK,
    time:d.time.trim(), serves:d.serves.trim(), ytid:ytid,
    addedBy:d.addedBy.trim(), tip:d.tip.trim(),
    img: d.img || (ytid?'https://i.ytimg.com/vi/'+ytid+'/hqdefault.jpg':''),
    ing:d.ing.filter(i=>i[1].trim()||i[2].trim()).map(i=>[i[0]||'🧺',i[1].trim(),i[2].trim()]),
    steps:d.steps.filter(s=>s[0].trim()||s[1].trim()||s[2]).map(s=>[s[0].trim(),s[1].trim(),s[2]||'']),
    updated:new Date().toISOString().slice(0,10),
  };
}
function upsert(saved){
  if(saved.custom || /^[cu]/.test(String(saved.id))){
    const i=S.customs.findIndex(x=>x.id===saved.id);
    if(i>=0) S.customs[i]=saved; else S.customs.push(saved);
  }else{
    S.overrides[saved.id]=saved;
  }
}
async function saveDraft(){
  if(S.saving) return;
  const d=S.draft; if(!d) return;
  if(!d.en.trim() && !d.cn.trim()){ flash('Give the dish a name first'); return; }
  const clean=cleanDraft();
  const id=S.editingId;
  if(id) clean.id=id;
  // keep existing lastCooked when editing
  if(id){ const prev=merged().find(x=>x.id===id); if(prev && prev.lastCooked) clean.lastCooked=prev.lastCooked; }
  const me = whoAmI();
  if(id){
    const prev0 = merged().find(x=>x.id===id);
    clean.addedBy = (prev0 && prev0.addedBy) || '';
    if(me){ clean.editedBy = me; clean.editedAt = today_(); }
  }else{
    if(me) clean.addedBy = me;
    clean.addedAt = today_();
  }
  S.saving=true; render();
  if(SHARED){
    api('save', clean).then(saved=>{
      S.saving=false; upsert(saved);
      if(saved.rev) S.rev=Math.max(S.rev, saved.rev);
      cacheShared();
      S.view='recipe'; S.recipeId=saved.id; S.step=0; S.draft=null; S.editingId=null;
      render(); flash(id?'Saved for everyone' + zh(' 已為全家儲存'):'Added to the cookbook' + zh(' 已加入食譜'));
    }).catch(()=>{
      S.saving=false; render(); flash("Couldn't save — check the connection" + zh(" 儲存失敗") + "");
    });
  }else{
    flash('Translating…');
    try{ await clientTranslate(clean); }catch(e){}
    let newId=id;
    if(!id){ newId='c'+Date.now(); clean.id=newId; clean.custom=true; S.customs.push(clean); }
    else if(S.customs.some(c=>c.id===id)){ clean.custom=true; S.customs=S.customs.map(c=>c.id===id?clean:c); }
    else S.overrides[id]=clean;
    persist();
    S.saving=false; S.view='recipe'; S.recipeId=newId; S.step=0; S.draft=null; S.editingId=null;
    render(); flash(id?'Saved':'Added to the cookbook');
  }
}
function deleteDish(){
  const id=S.editingId; if(!id) return;
  if(!confirm('Remove this dish from the family cookbook?' + zh(' 確定移除呢道菜？'))) return;
  const done=()=>{ S.view='home'; S.recipeId=null; S.draft=null; S.editingId=null; render(); flash('Removed'); };
  if(SHARED){
    showToast('☁ Removing…' + zh(' 刪除中') + '…', true);
    api('delete', id).then(()=>{
      if(/^[cu]/.test(id)) S.customs=S.customs.filter(c=>c.id!==id); else S.overrides[id]={del:true};
      cacheShared(); done();
    }).catch(()=>flash("Couldn't remove — try again" + zh(" 刪除失敗") + ""));
  }else{
    if(S.customs.some(c=>c.id===id)) S.customs=S.customs.filter(c=>c.id!==id);
    else S.overrides[id]='deleted';
    persist(); done();
  }
}
function stampCooked(r){
  const today=new Date().toISOString().slice(0,10);
  const full=Object.assign({}, r, {lastCooked:today});
  upsert(full);
  if(SHARED){ cacheShared(); api('save', full).then(saved=>{ upsert(saved); if(saved.rev) S.rev=Math.max(S.rev,saved.rev); cacheShared(); }).catch(()=>{}); }
  else { persist(); }
}

function setImportNote(msg, err){

  const el=document.getElementById('importNote');

function runImport(){
  const d=S.draft; if(!d) return;
  const url=(d.source||'').trim();
  if(!url){ setImportNote('Paste a link first.', true); return; }
  if(S.importing) return;
  S.importing=true; S.importErr=false; S.importNote='Reading the page… this takes a few seconds.'; render();
  if(!SHARED){
    S.importing=false;
    setImportNote('Automatic filling works in the family app — open the shared link to use it.' + zh(' 自動填寫請用家庭版連結。'), true);
    return;
  }
  api('extract', url).then(out=>applyImport(out,url))
    .catch(()=>{ S.importing=false; setImportNote("That didn't work. Try again, or fill it in by hand below." + zh(" 請再試或自行輸入。") + "", true); });
}
function applyImport(out, url){
  S.importing=false;
  const d=S.draft; if(!d) return;
  const vid=ytId(url);
  if(!out || out.error){
    if(out && out.img && !d.img) d.img=out.img;
    const map={
      'not-configured':"Automatic filling isn't available here. Type the recipe in below.",
      'unreadable': out&&out.img ? "Got the photo, but couldn't read the recipe — some sites block it. Type it in below." : "Couldn't open that link — some sites block it. Try another, or type it in below." + zh(" 打唔開個連結。") + "",
      'no-recipe':"That page doesn't publish a recipe we can read. Try the recipe's own page (not a listing or a video), or type it in below." + zh(" 該頁沒有可讀取的食譜資料。") + "",
      'api':'Something went wrong reading that page. Try again in a minute.',
      'parse':"That didn't work. Try again, or fill it in by hand below.",
    };
    setImportNote(map[(out&&out.error)||'parse']||map.parse, true);
    return;
  }
  const cats=COURSES.map(c=>c.key);
  const ing=(out.ing||[]).filter(x=>x&&(x[1]||x[2])).map(x=>[x[0]||'🧺',x[1]||'',x[2]||'']);
  const steps=(out.steps||[]).filter(x=>x&&(x[0]||x[1])).map(x=>[x[0]||'',x[1]||'',x[2]||'']);
  Object.assign(d,{
    en:out.en||d.en, cn:out.cn||d.cn,
    cat:cats.indexOf(out.cat)>=0?out.cat:d.cat,
    time:out.time||d.time, serves:String(out.serves||d.serves),
    tip:out.tip||d.tip,
    ytid:vid||out.ytid||d.ytid,
    img:d.img||out.img||'',
    ing:ing.length?ing.concat([['🧺','','']]):d.ing,
    steps:steps.length?steps.concat([['','','']]):d.steps,
  });
  if(out.partial){
    setImportNote('Videos rarely publish their recipe, so only the name and photo were filled in — type the ingredients and steps below.' + zh(' 影片通常沒有食譜資料，請自行輸入材料同步驟。'), true);
  } else {
    setImportNote('Filled in '+ing.length+' ingredients and '+steps.length+' steps — please check before saving.' + zh(' 已填入，儲存前請檢查。'), false);
  }
}

/* ============ photos ============

   A photo straight off a modern phone is several megabytes and perhaps 4000
   pixels wide. The cookbook shows it in a column 440 points across, so almost
   all of that is thrown away on screen while still being carried up to Drive
   and back down to every phone forever.

   So each photo is shrunk here, before it is ever sent. The size below is
   generous for a sharp screen; the byte budget is the real promise — if a photo
   still comes out too heavy the quality and then the size step down until it
   fits. Budgets are in characters of the encoded photo, which is about a third
   larger than the file itself.                                               */
/* The cookbook is read in a column about 440 points wide, so these are already
   generous for a sharp screen — and the weight is what decides how quickly a
   picture appears on a phone away from wifi. */
const COVER_SIDE = 700, COVER_BUDGET = 60000;    /* ~43 KB */
const NOTE_SIDE  = 900, NOTE_BUDGET  = 60000;    /* a photographed label has to stay readable */
const STEP_SIDE  = 480, STEP_BUDGET  = 28000;    /* ~20 KB */

function shrinkImage(src, maxSide, budget){
  return new Promise(function(resolve, reject){
    {
      const img = new Image();
      img.onerror = ()=>reject(new Error('not an image'));
      img.onload = function(){
        const longest = Math.max(img.width, img.height) || 1;
        let side = Math.min(maxSide, longest);
        let out = '';
        for(let pass = 0; pass < 6; pass++){
          const sc = Math.min(1, side / longest);
          const cv = document.createElement('canvas');
          cv.width  = Math.max(1, Math.round(img.width  * sc));
          cv.height = Math.max(1, Math.round(img.height * sc));
          const cx = cv.getContext('2d');
          cx.fillStyle = '#FFFFFF';                 /* JPEG cannot hold see-through */
          cx.fillRect(0, 0, cv.width, cv.height);
          cx.drawImage(img, 0, 0, cv.width, cv.height);
          out = cv.toDataURL('image/jpeg', Math.max(0.42, 0.66 - pass * 0.06));
          if(out.length <= budget) break;
          side = Math.round(side * 0.82);
        }
        resolve(out);
      };
      img.src = src;
    }
  });
}
function shrinkPhoto(file, maxSide, budget){
  return new Promise(function(resolve, reject){
    const reader = new FileReader();
    reader.onerror = ()=>reject(new Error('unreadable'));
    reader.onload = ev=>shrinkImage(ev.target.result, maxSide, budget).then(resolve, reject);
    reader.readAsDataURL(file);
  });
}

/* Housekeeping, not a family feature: photos saved before the app began
   shrinking them on the way in are still full size, and they are the slow ones
   to load. This walks through them, makes each smaller and puts it back under
   the same name, so no recipe changes and everyone's cookbook is left exactly
   as it was. It was run once after the change; it is kept here so it can be
   run again from the browser console if a batch of large photos ever appears.
   Deliberately not on any screen — nobody should have to maintain a cookbook. */
async function shrinkStored(){
  if(!SHARED){ flash('Only in the family app'); return; }
  if(S.tidy) return;
  const want = Object.create(null);
  merged().forEach(r=>{
    const h = phRef(r.img); if(h) want[h] = COVER_SIDE;
    (r.steps||[]).forEach(st=>{ const g = phRef(st && st[2]); if(g && !want[g]) want[g] = STEP_SIDE; });
  });
  const list = Object.keys(want);
  if(!list.length){ flash('No stored photos to tidy' + zh(' 沒有相片需要處理')); return; }

  let done = 0, saved = 0;
  S.tidy = {total:list.length, done:0, saved:0}; render();
  for(const h of list){
    try{
      let url = PMEM[h] || await IDB.get('photos', h);
      if(!url){ const got = await api('photos', [h]); url = got && got[h]; }
      const side = want[h];
      const budget = side === COVER_SIDE ? COVER_BUDGET : STEP_BUDGET;
      if(url && url.length > budget){
        const small = await shrinkImage(url, side, budget);
        if(small.length < url.length){
          const freed = await api('rephoto', {h:h, data:small});
          if(freed){ saved += freed; PMEM[h] = small; IDB.put('photos', h, small); }
        }
      }
    }catch(e){}
    done++;
    S.tidy = {total:list.length, done:done, saved:saved};
    if(S.view === 'settings') render();
  }
  S.tidy = null; render();
  flash(saved ? ('Photos tidied · ' + Math.round(saved/1400) + ' KB lighter')
              : ('Photos were already small' + zh(' 相片已經夠細')));
}
const photoKB = url => Math.max(1, Math.round(url.length / 1400));

/* Step photos are kept smaller than the cover photo — a recipe can have many. */
function pickStepPhoto(e, idx){
  const file = e.target.files && e.target.files[0];
  if(!file || !S.draft) return;
  showToast('Shrinking the photo…' + zh(' 處理相片中') + '…', true);
  shrinkPhoto(file, STEP_SIDE, STEP_BUDGET).then(function(url){
    hideToast();
    if(!S.draft) return;
    if(!S.draft.steps[idx]) S.draft.steps[idx] = ['','',''];
    S.draft.steps[idx][2] = url;
    render();
    flash('Photo added · ' + photoKB(url) + ' KB');
  }).catch(function(){
    hideToast();
    flash("Couldn't use that photo" + zh(" 相片讀取失敗") + "");
  });
}
function pickNotePhoto(e){
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  showToast('Shrinking the photo…' + zh(' 處理相片中') + '…', true);
  shrinkPhoto(file, NOTE_SIDE, NOTE_BUDGET).then(function(url){
    hideToast();
    S.noteImg = url;
    render();
    flash('Photo added · ' + photoKB(url) + ' KB');
  }).catch(function(){
    hideToast();
    flash("Couldn't use that photo" + zh(" 相片讀取失敗") + "");
  });
}

  });
}

/* ============ wake lock ============ */
function acquireWake(){
  if(!S.wake || !navigator.wakeLock) return;
  navigator.wakeLock.request('screen').then(l=>{ wakeLock=l; }).catch(()=>{});
}
function releaseWake(){ if(wakeLock){ try{ wakeLock.release(); }catch(e){} wakeLock=null; } }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && S.view==='cook') acquireWake(); });

/* ============ actions ============ */
const ACT={
  noop:(a,b,e)=>{ e.stopPropagation(); },
  goHome:()=>{ S.backTo=''; if(S.view==='home'&&S.cat==='fav') S.cat='all'; S.view='home'; render(); },
  /* Nothing to go back from at a desk — the list never left the screen. */
  goFavs:()=>{ S.view='home'; S.cat='fav'; S.query=''; render(); },
  goList:()=>{ S.view='list'; render(); },
  goSettings:()=>{ S.view='settings'; render(); },
  goBoard:()=>{ S.view='board'; S.noteDraft=''; S.noteEditing=null; S.noteImg=''; render(); },
  cancelNote:()=>{ S.noteDraft=''; S.noteEditing=null; S.noteImg=''; render(); },
  dropNotePhoto:()=>{ S.noteImg=''; render(); },
  zoomNote:id=>{ const n=S.notes.find(x=>x.id===id); if(n&&n.img){ S.zoom=n.img; render(); } },
  closeZoom:()=>{ S.zoom=''; render(); },
  editNote:id=>{
    const n=S.notes.find(x=>x.id===id); if(!n) return;
    S.view='board'; S.noteEditing=id; S.noteDraft=n.text; S.noteImg=n.img||''; render();
  },
  openFavPick:()=>{ S.favPick=[]; S.favPickQ=''; render(); },
  closeFavPick:()=>{ S.favPick=null; S.favPickQ=''; render(); },
  togglePick:id=>{
    if(!S.favPick) return;
    const i=S.favPick.indexOf(id);
    if(i<0) S.favPick.push(id); else S.favPick.splice(i,1);
    render();
  },
  addFavPicked:()=>{
    const picked=(S.favPick||[]).filter(id=>!S.favs.includes(id));
    if(!picked.length){ flash('Choose a dish first' + zh(' 請先揀菜')); return; }
    S.favs=S.favs.concat(picked); persist();
    S.favPick=null; S.favPickQ=''; render();
    flash(picked.length + (picked.length===1?' dish added':' dishes added') + zh(' 已加入最愛'));
  },
  saveNote:()=>{
    const text=(S.noteDraft||'').trim();
    if(!text){ flash('Write something first' + zh(' 請先輸入')); return; }
    const was=S.noteEditing ? S.notes.find(n=>n.id===S.noteEditing) : null;
    pushNote({id:S.noteEditing||newNoteId(), text:text, by:whoAmI(), pinned:was?!!was.pinned:false, img:S.noteImg||'', book:was?noteBook(was):S.book},
             S.noteEditing?'Note saved':'Put on the board');
    S.noteDraft=''; S.noteEditing=null; S.noteImg='';
  },
  pinNote:id=>{
    const n=S.notes.find(x=>x.id===id); if(!n) return;
    pushNote({id:n.id, text:n.text, by:whoAmI(), pinned:!n.pinned, img:n.img||'', book:noteBook(n)},
             n.pinned?'Taken off the Cook page':'Now on the Cook page');
  },
  delNote:id=>{
    const n=S.notes.find(x=>x.id===id); if(!n) return;
    if(!confirm('Remove this note?' + zh(' 確定移除呢個留言？'))) return;
    S.notes=S.notes.filter(x=>x.id!==id);
    if(S.noteEditing===id){ S.noteEditing=null; S.noteDraft=''; }
    render();
    if(SHARED) api('unnote', id).then(applyNotes).catch(()=>flash("Couldn't remove — try again" + zh(' 移除失敗')));
    else flash('Removed');
  },
  goAdd:()=>openAdd(),
  openSheet:()=>{ S.sheet=true; render(); },
  closeSheet:(a,b,e)=>{ e.stopPropagation(); S.sheet=false; render(); },
  pickCat:(k,b,e)=>{ e.stopPropagation(); S.cat=k; S.sheet=false; render(); },
  open:id=>{ S.backTo=''; S.view='recipe'; S.recipeId=id; S.step=0; render(); },
  /* Opening a dish from the planner is a look, not a departure: Back returns
     to the day being planned, with the rest of the menu still on screen. */
  preview:id=>{ S.backTo='menu'; S.view='recipe'; S.recipeId=id; S.step=0; render(); },
  recipeBack:()=>{
    if(S.backTo==='menu'){ S.backTo=''; S.view='menu'; render(); return; }
    ACT.goHome();
  },
  fav:(id,b,e)=>{ e.stopPropagation(); S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):S.favs.concat([id]); persist(); S.view==='home'?renderGridOnly():render(); },
  toggleFav:()=>{ const r=cur(); if(!r) return; ACT.fav(r.id,null,{stopPropagation:()=>{}}); render(); },
  editThis:()=>{ const r=cur(); if(r) openEdit(r); },
  startCook:()=>{ S.view='cook'; S.step=0; render(); acquireWake(); },
  endCook:()=>{ S.view='recipe'; render(); releaseWake(); },
  prevStep:()=>{ S.step=Math.max(0,S.step-1); render(); },
  nextStep:()=>{
    const r=cur(); if(!r) return;
    const n=(r.steps||[]).length;
    if(S.step>=n-1){ stampCooked(r); S.view='recipe'; render(); releaseWake(); flash('Marked as cooked today'); }
    else { S.step++; render(); }
  },
  addAll:()=>{
    const r=cur(); if(!r) return;
    const add=(r.ing||[]).filter(i=>!inList(i[1])).map(i=>({en:i[1],cn:i[2],done:false}));
    if(!add.length){ flash('Already on the list'); return; }
    S.shopping=S.shopping.concat(add); persist(); render();
    flash(add.length+' added to shopping list');
  },
  ingShow:ix=>{ const r=cur(); const i=r&&r.ing[ix]; if(i){ S.market={en:i[1],cn:i[2]}; render(); } },
  ingAdd:(ix,b,e)=>{
    e.stopPropagation();
    const r=cur(); const i=r&&r.ing[ix]; if(!i) return;
    if(inList(i[1])){ flash('Already on the list'); return; }
    S.shopping=S.shopping.concat([{en:i[1],cn:i[2],done:false}]); persist(); render();
    flash('Added to shopping list');
  },
  shopToggle:i=>{ S.shopping[i].done=!S.shopping[i].done; persist(); render(); },
  shopRemove:i=>{ S.shopping.splice(i,1); persist(); render(); },
  shopShow:i=>{ const s=S.shopping[i]; if(s){ S.market={en:s.en,cn:s.cn}; render(); } },
  clearBought:()=>{ S.shopping=S.shopping.filter(s=>!s.done); persist(); render(); },
  closeMarket:()=>{ S.market=null; render(); },
  pickDraftCat:k=>{ if(S.draft){ S.draft.cat=k; render(); } },
  pickDraftBook:k=>{ if(S.draft){ S.draft.book=k; render(); } },
  pickBook:k=>{ S.book=k; S.cat='all'; persist(); render(); },
  goMenu:()=>{ S.view='menu'; S.menuBook=S.book; S.menuDate=S.menuDate||dayKey(0); S.menuPick=''; S.pickBook=''; S.pickCat=''; render(); },
  goMenuOn:k=>{ S.view='menu'; S.menuBook=S.book; S.menuDate=k; S.menuPick=''; S.pickBook=''; S.pickCat=''; render(); },
  pickMenuDay:k=>{ S.menuDate=k; S.menuPick=''; render(); },
  pickMenuBook:b=>{ S.menuBook=b; S.menuPick=''; render(); },
  pickPoolBook:b=>{ S.pickBook=b||''; if(S.pickCat && !merged().some(r=>(!S.pickBook||bookOf(r)===S.pickBook)&&r.cat===S.pickCat)) S.pickCat=''; render(); },
  pickPoolCat:k=>{ S.pickCat=k||''; render(); },
  clearPoolFilters:()=>{ S.pickBook=''; S.pickCat=''; render(); },
  menuOn:id=>{ const b=S.menuBook||S.book, k=S.menuDate||dayKey(0); const ids=menuIds(b,k); if(ids.indexOf(id)<0) ids.push(id); setMenu(b, k, ids); render(); },
  menuOff:id=>{ const b=S.menuBook||S.book, k=S.menuDate||dayKey(0); setMenu(b, k, menuIds(b,k).filter(x=>x!==id)); render(); },
  menuClear:()=>{ const b=S.menuBook||S.book, k=S.menuDate||dayKey(0); setMenu(b, k, []); render(); flash('Menu cleared' + zh(' 已清除')); },
  /* From the recipe: put this dish on a named day, or take it off again. The
     day comes from the chip that was tapped, never from the planner's state. */
  menuDay:(id, k)=>{
    if(!id || !k) return;
    const b = S.book;
    const ids = menuIds(b, k);
    const at = ids.indexOf(id);
    if(at < 0) ids.push(id); else ids.splice(at, 1);
    setMenu(b, k, ids);
    render();
    flash((at < 0 ? 'Added to ' : 'Taken off ') + dayLabel(k) + zh(at < 0 ? ' 已加入' : ' 已移除'));
  },
  shareMenu:()=>shareMenu(S.menuBook||S.book, S.menuDate||dayKey(0)),
  shareMenuOn:k=>shareMenu(S.book, k),
  menuToList:k=>{
    const items=menuItems(S.menuBook||S.book, k||S.menuDate||dayKey(0));
    if(!items.length){ flash('Choose a dish first' + zh(' 請先揀菜')); return; }
    let add=[];
    items.forEach(r=>(r.ing||[]).forEach(i=>{
      if(!i[1] || inList(i[1]) || add.some(a=>a.en===i[1])) return;
      add.push({en:i[1], cn:i[2], done:false});
    }));
    if(!add.length){ flash('Everything is already on the list' + zh(' 已經喺清單')); return; }
    S.shopping=S.shopping.concat(add); persist(); S.view='list'; render();
    flash(add.length+' added to shopping list');
  },
  newCourse:()=>{ S.newCourse={en:'',cn:''}; render(); },
  closeCourse:()=>{ S.newCourse=null; render(); },
  saveCourse:()=>saveCourse(),
  pickSize:k=>{ S.size=k; persist(); render(); },
  saveWho:()=>{
    const el=document.getElementById('whoInput');
    const name=(el&&el.value.trim())||'';
    if(!name){ flash('Please type your name' + zh(' 請輸入你嘅名')); return; }
    setWho(name); S.askWho=false; render(); flash('Hello '+name+'!');
  },
  changeWho:()=>{ S.askWho=true; render(); },
  toggleCn:()=>{ S.showCn=!S.showCn; persist(); render(); },
  toggleWake:()=>{ S.wake=!S.wake; persist(); render(); },
  cancelEdit:()=>{ S.view=S.editingId?'recipe':'home'; S.draft=null; S.editingId=null; render(); },
  saveDraft:()=>saveDraft(),
  deleteDish:()=>deleteDish(),
  runImport:()=>runImport(),
  addIng:()=>{ S.draft.ing.push(['🧺','','']); render(); },
  addStep:()=>{ S.draft.steps.push(['','','']); render(); },
  remIng:i=>{ S.draft.ing.splice(i,1); if(!S.draft.ing.length) S.draft.ing.push(['🧺','','']); render(); },
  remStep:i=>{ S.draft.steps.splice(i,1); if(!S.draft.steps.length) S.draft.steps.push(['','','']); render(); },
  remStepPhoto:i=>{ if(S.draft&&S.draft.steps[i]) S.draft.steps[i][2]=''; render(); },
};

const app=document.getElementById('app');
app.addEventListener('touchstart', pullStart, {passive:true});
app.addEventListener('touchmove', pullMove, {passive:false});
app.addEventListener('touchend', pullEnd, {passive:true});
app.addEventListener('touchcancel', ()=>{ pull.on=false; pullPaint(0); }, {passive:true});

/* ============ the wheel, anywhere in a column ============

   On a desk each column scrolls on its own, but only the middle of a column
   actually scrolls: the search box and course chips above the dish list, and
   the big photo above a recipe, sit outside the scrolling part. Putting the
   pointer over any of those and turning the wheel did nothing, which reads as
   the app having frozen. So a wheel turn anywhere over a column is handed to
   that column's scrolling part. */
/* Can this box still move the way the wheel is asking it to? A box already at
   its bottom is no use to a downward turn, and the turn should carry on to
   whatever is behind it rather than being swallowed. */
function canScroll(el, dy){
  if(!el) return false;
  const room = el.scrollHeight - el.clientHeight;
  if(room <= 4) return false;
  if(dy > 0) return el.scrollTop < room - 1;
  if(dy < 0) return el.scrollTop > 1;
  return false;
}
app.addEventListener('wheel', e=>{
  if(!WIDE()) return;
  const dy = e.deltaY;
  if(!dy) return;
  /* Walk up from whatever is under the pointer — a card, its photo, a chip —
     looking for something that can actually take the turn. */
  let el = e.target;
  while(el && el.nodeType === 1 && el.id !== 'app'){
    const oy = getComputedStyle(el).overflowY;
    if((oy === 'auto' || oy === 'scroll') && canScroll(el, dy)) return;   /* the browser has this */
    el = el.parentElement;
  }
  /* Nothing under the pointer will move: hand the turn to this column's
     scrolling part, so the wheel works over a photo, a header or a card alike. */
  const col = e.target.closest && e.target.closest('#browsecol,#recipecol,#mainpane');
  if(!col) return;
  const pane = col.querySelector('.pane');
  if(!canScroll(pane, dy)) return;
  pane.scrollTop += dy;
  e.preventDefault();
}, {passive:false});

app.addEventListener('click',e=>{
  syncSoon();
  const el=e.target.closest('[data-act]'); if(!el) return;
  const parts=el.dataset.act.split(':');
  const fn=ACT[parts[0]];
  if(fn) fn(parts[1], parts[2], e);
});
app.addEventListener('input',e=>{
  const k=e.target.dataset.in; if(!k) return;
  const v=e.target.value;
  if(k==='query'){ S.query=v; renderGridOnly(); return; }
  if(k==='menupick'){ S.menuPick=v; render(); const el=document.querySelector('[data-in="menupick"]'); if(el){ el.focus(); el.setSelectionRange(v.length,v.length); } return; }
  if(k==='notedraft'){ S.noteDraft=v; return; }
  if(k==='favpick'){ S.favPickQ=v; renderPickOnly(); return; }
  if(k==='menunote'){ const m=menuFor(S.menuBook||S.book, S.menuDate); if(m) m.note=v; return; }
  if(k==='menuoccasion'){ const m=menuFor(S.menuBook||S.book, S.menuDate); if(m) m.occasion=v; return; }
  const d=S.draft; if(!d) return;
  if(k==='den') d.en=v;
  else if(k==='dcn') d.cn=v;
  else if(k==='dtime') d.time=v;
  else if(k==='dserves') d.serves=v;
  else if(k==='daddedby') d.addedBy=v;
  else if(k==='dyt') d.ytid=v;
  else if(k==='dtip') d.tip=v;
  else if(k==='dsource') d.source=v;
  else{
    const p=k.split(':');
    if(p[0]==='ing') d.ing[+p[1]][+p[2]]=v;
    else if(p[0]==='step') d.steps[+p[1]][+p[2]]=v;
  }
});
app.addEventListener('change',e=>{
  const k=e.target.dataset.in||'';
  if(k==='photo'){ pickPhoto(e); return; }
  if(k==='notephoto'){ pickNotePhoto(e); return; }
  if(k==='menudate'){ const v=e.target.value; if(v){ S.menuDate=v; S.menuPick=''; render(); } return; }
  if(k==='menunote'){ const b=S.menuBook||S.book, key=S.menuDate||dayKey(0); setMenu(b, key, menuIds(b,key), {note:e.target.value}); return; }
  if(k==='menuoccasion'){ const b=S.menuBook||S.book, key=S.menuDate||dayKey(0); setMenu(b, key, menuIds(b,key), {occasion:e.target.value}); return; }
  if(k.indexOf('stepphoto:')===0){ pickStepPhoto(e, +k.split(':')[1]); }
});

/* ============ boot ============ */
/* Draw whatever this phone already has straight away, then quietly ask the
   server for the handful of things that changed. The cookbook is on screen in
   well under a second even on a slow connection, and nothing added recently can
   be lost by a failed load — it is already saved on the server before it leaves
   the edit screen. */
loadLocal();
try{ localStorage.removeItem('tinsCookbook.cache.v1'); }catch(e){}   /* pre-v6 leftovers */
if(SHARED && !whoAmI()) S.askWho = true;
render();
loadCache().then(had=>{
  if(had){ S.loaded=true; render(); }
  loadShared();
});
/* Coming back to the app after a while: pick up anything the others changed. */
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  syncIdle = 0;
  if(S.loaded && !S.syncing && SHARED) loadShared(); else scheduleSync();
});

/* Installed-app niceties: remember the launch mode and keep the layout stable. */
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
